name: Build Desktop Apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: create or update this GitHub Release, for example v0.1.0. Leave empty to only upload workflow artifacts."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows app
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts\build_desktop.py --windowed

      - name: Archive Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\洛克模拟器" -DestinationPath "roco-battle-simulator-windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: roco-battle-simulator-windows
          path: roco-battle-simulator-windows.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build macOS app
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/build_desktop.py --windowed

      - name: Archive macOS app
        run: |
          if [ -d "dist/洛克模拟器.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/洛克模拟器.app" "roco-battle-simulator-macos.zip"
          else
            ditto -c -k --sequesterRsrc --keepParent "dist/洛克模拟器" "roco-battle-simulator-macos.zip"
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: roco-battle-simulator-macos
          path: roco-battle-simulator-macos.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          ls -lah release-assets

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip --title "$RELEASE_TAG" --generate-notes
          fi
