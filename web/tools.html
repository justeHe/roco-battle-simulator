<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛克王国 · 工具</title>
<link rel="stylesheet" href="theme.css">
<style>
body { min-height: 100vh; }
.tools-layout {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}
.tools-sidebar {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--r-lg);
  padding: 12px;
  position: sticky;
  top: 14px;
  box-shadow: var(--shadow-sm);
}
.tools-kicker {
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 900;
  margin: 2px 4px 10px;
}
.tool-link {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  border: 2px solid transparent;
  border-radius: var(--r-md);
  background: var(--bg-input);
  color: var(--text-primary);
  font-family: inherit;
  padding: 10px;
  text-align: left;
  cursor: pointer;
}
.tool-link + .tool-link { margin-top: 8px; }
.tool-link.active {
  border-color: var(--primary);
  background: rgba(255,255,255,.74);
  box-shadow: var(--shadow-sm);
}
.tool-link strong {
  display: block;
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 900;
}
.tool-link span {
  color: var(--text-secondary);
  font-size: 11px;
}
.tool-badge {
  border: 1px solid rgba(245,166,35,.38);
  border-radius: var(--r-pill);
  color: var(--primary-dark);
  background: rgba(245,166,35,.12);
  padding: 2px 6px;
  font-size: 10px;
  font-weight: 900;
}
.tool-surface {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--r-lg);
  min-height: calc(100vh - 96px);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.tool-panel[hidden] { display: none; }
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding: 16px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(255,255,255,.74), rgba(255,255,255,.36));
}
.panel-head h1 {
  margin: 0;
  color: var(--text-primary);
  font-size: 20px;
  line-height: 1.2;
}
.panel-head p {
  margin: 5px 0 0;
  color: var(--text-secondary);
  font-size: 12px;
}
.panel-count {
  flex: 0 0 auto;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--bg-input);
  color: var(--text-secondary);
  padding: 8px 10px;
  font-size: 11px;
  font-weight: 800;
}
.query-bar {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) 180px 86px;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.query-bar .roco-input,
.query-bar .roco-select { width: 100%; }
.group-strip {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.group-pill {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--bg-input);
  color: var(--text-primary);
  font-family: inherit;
  padding: 8px;
  cursor: pointer;
  text-align: left;
}
.group-pill:hover,
.group-pill.active { border-color: var(--primary); background: rgba(255,255,255,.72); }
.group-pill strong { display: block; font-size: 12px; font-weight: 900; }
.group-pill span { color: var(--text-secondary); font-size: 10px; }
.result-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 16px 4px;
}
.result-head h2 {
  margin: 0;
  font-size: 16px;
  color: var(--text-primary);
}
.result-head span {
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 800;
}
.member-grid,
.hatch-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 10px;
  padding: 12px 16px 16px;
}
.member-card,
.hatch-card {
  display: grid;
  grid-template-columns: 58px minmax(0, 1fr);
  gap: 10px;
  background: var(--bg-input);
  border: 2px solid transparent;
  border-radius: var(--r-md);
  padding: 10px;
  min-height: 110px;
  transition: border-color .15s, transform .15s, background .15s;
}
.member-card:hover,
.hatch-card:hover {
  border-color: var(--primary);
  background: rgba(255,255,255,.72);
  transform: translateY(-1px);
}
.member-avatar,
.hatch-avatar {
  width: 58px;
  height: 58px;
  object-fit: contain;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: rgba(255,255,255,.7);
  padding: 4px;
}
.member-title,
.hatch-title {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.member-title a,
.hatch-title a {
  color: var(--primary-dark);
  font-size: 14px;
  font-weight: 900;
  text-decoration: none;
}
.member-title a:hover,
.hatch-title a:hover { text-decoration: underline; }
.group-tag,
.status-tag,
.range-tag {
  flex: 0 0 auto;
  border-radius: var(--r-pill);
  padding: 2px 6px;
  font-size: 10px;
  font-weight: 900;
}
.group-tag {
  color: var(--primary-dark);
  background: rgba(245,166,35,.12);
  border: 1px solid rgba(245,166,35,.32);
}
.status-tag,
.range-tag {
  color: var(--text-secondary);
  background: var(--bg-card);
  border: 1px solid var(--border);
}
.status-tag.ok {
  color: var(--hp-green);
  border-color: rgba(92,184,92,.36);
  background: rgba(92,184,92,.08);
}
.member-meta,
.hatch-meta {
  color: var(--text-secondary);
  font-size: 11px;
  line-height: 1.55;
  margin-top: 4px;
}
.chain-row,
.range-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 8px;
}
.chain-chip,
.range-chip {
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 10px;
  padding: 2px 5px;
}
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0 16px 16px;
}
.page-btn {
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  background: var(--bg-card);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 11px;
  font-weight: 800;
  padding: 6px 10px;
  cursor: pointer;
}
.page-btn.active,
.page-btn:hover:not(:disabled) { border-color: var(--primary); background: rgba(255,255,255,.78); }
.page-btn:disabled { opacity: .42; cursor: not-allowed; }
.empty-state {
  margin: 16px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-lg);
  background: var(--bg-input);
  color: var(--text-secondary);
  padding: 34px;
  text-align: center;
  font-size: 13px;
}
.hatch-form {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.hatch-form-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 110px;
  gap: 8px;
}
.field-stack label {
  display: block;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 800;
  margin: 0 0 6px;
}
.field-stack .roco-input { width: 100%; }
.hint-line {
  padding: 10px 16px 0;
  color: var(--text-secondary);
  font-size: 11px;
}
.hatch-card {
  grid-template-columns: 66px minmax(0, 1fr);
  min-height: 128px;
}
.hatch-avatar {
  width: 66px;
  height: 66px;
}
.hatch-subline {
  color: var(--text-secondary);
  font-size: 11px;
  margin-top: 4px;
}
.type-chart-wrap {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.type-chart-scroll {
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: rgba(255,255,255,.38);
}
.type-chart {
  min-width: 940px;
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  font-size: 11px;
}
.type-chart th,
.type-chart td {
  border-right: 1px solid rgba(185,151,91,.22);
  border-bottom: 1px solid rgba(185,151,91,.22);
  height: 34px;
  text-align: center;
}
.type-chart th {
  background: rgba(255,248,232,.94);
  color: var(--text-primary);
  font-weight: 900;
  position: sticky;
  z-index: 2;
}
.type-chart thead th { top: 0; }
.type-chart tbody th {
  left: 0;
  text-align: left;
  padding: 0 8px;
}
.type-head {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.type-head.vertical {
  flex-direction: column;
  gap: 2px;
}
.type-icon {
  width: 18px;
  height: 18px;
  object-fit: contain;
  vertical-align: middle;
}
.type-cell { background: rgba(255,255,255,.5); color: var(--text-muted); }
.type-cell.super { background: rgba(92,184,92,.22); color: #2e7d32; font-weight: 900; }
.type-cell.resist { background: rgba(217,83,79,.18); color: #b6403a; font-weight: 900; }
.type-cell.neutral span { opacity: .55; }
.type-form {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.type-form-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) 96px;
  gap: 8px;
}
.type-result-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 10px;
  padding: 12px 16px 16px;
}
.type-result-card {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px;
}
.type-result-card h3 {
  margin: 0 0 8px;
  color: var(--text-primary);
  font-size: 14px;
}
.type-pill-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.type-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  background: var(--bg-card);
  color: var(--text-primary);
  padding: 4px 7px;
  font-size: 11px;
  font-weight: 900;
}
.type-pill.super { border-color: rgba(92,184,92,.42); background: rgba(92,184,92,.1); color: #2e7d32; }
.type-pill.resist { border-color: rgba(217,83,79,.34); background: rgba(217,83,79,.08); color: #b6403a; }
.type-final {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 18px;
  font-weight: 900;
  color: var(--primary-dark);
}
.damage-form {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.damage-layout {
  display: grid;
  grid-template-columns: minmax(300px, 1.05fr) minmax(290px, .9fr) minmax(300px, 1.05fr);
  gap: 10px;
  align-items: stretch;
}
.damage-block {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--bg-input);
  padding: 12px;
  min-width: 0;
}
.damage-side-block {
  display: flex;
  flex-direction: column;
}
.damage-block h2 {
  margin: 0 0 10px;
  color: var(--text-primary);
  font-size: 14px;
}
.damage-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.damage-fields.single { grid-template-columns: 1fr; }
.damage-identity-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.damage-identity-grid.defender {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.damage-identity-grid .field-stack {
  min-width: 0;
}
.damage-identity-grid .roco-select,
.damage-identity-grid .roco-input {
  width: 100%;
}
.damage-field-full {
  grid-column: 1 / -1;
}
.damage-skill-picker {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr);
  gap: 7px;
  align-items: center;
}
.damage-skill-icon {
  width: 38px;
  height: 38px;
  object-fit: contain;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: rgba(255,255,255,.72);
  padding: 3px;
}
.damage-skill-icon.empty {
  display: grid;
  place-items: center;
  color: var(--text-secondary);
  font-size: 10px;
  font-weight: 900;
}
.damage-iv-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  margin-top: 8px;
}
.damage-check {
  display: flex;
  align-items: center;
  gap: 5px;
  min-height: 30px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 11px;
  font-weight: 800;
  padding: 4px 6px;
}
.damage-check input { margin: 0; }
.damage-check.disabled {
  opacity: .52;
}
.damage-pokemon-preview {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  margin: 10px 0;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: rgba(255,255,255,.48);
  padding: 10px;
  min-height: 112px;
}
.damage-pokemon-preview img {
  width: 88px;
  height: 88px;
  object-fit: contain;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: rgba(255,255,255,.7);
  padding: 4px;
}
.damage-pokemon-preview strong {
  display: block;
  color: var(--text-primary);
  font-size: 13px;
}
.damage-pokemon-preview span {
  display: block;
  color: var(--text-secondary);
  font-size: 11px;
  margin-top: 3px;
}
.damage-nature-effect {
  width: 100%;
  min-height: 28px;
  display: flex;
  align-items: center;
  justify-content: stretch;
  flex-wrap: nowrap;
  gap: 6px;
  margin-top: 6px;
  overflow: visible;
}
.nature-chip {
  flex: 1 1 0;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 10px;
  font-weight: 900;
  line-height: 1.2;
  padding: 4px 6px;
  text-align: center;
  white-space: nowrap;
}
.nature-chip.up {
  color: var(--hp-green);
  border-color: rgba(92,184,92,.34);
  background: rgba(92,184,92,.08);
}
.nature-chip.down {
  color: #b6403a;
  border-color: rgba(217,83,79,.32);
  background: rgba(217,83,79,.08);
}
.damage-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-top: 10px;
}
.damage-actions .hint {
  color: var(--text-secondary);
  font-size: 11px;
}
.damage-result-layout {
  display: grid;
  grid-template-columns: 270px minmax(0, 1fr);
  gap: 10px;
  padding: 12px 16px 16px;
}
.damage-summary,
.damage-detail {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--bg-input);
  padding: 12px;
}
.damage-number {
  color: var(--primary-dark);
  font-size: 34px;
  font-weight: 900;
  line-height: 1;
}
.damage-summary-meta {
  margin-top: 8px;
  color: var(--text-secondary);
  font-size: 12px;
  line-height: 1.6;
}
.damage-hpbar {
  height: 10px;
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  background: rgba(217,83,79,.14);
  overflow: hidden;
  margin-top: 10px;
}
.damage-hpbar span {
  display: block;
  height: 100%;
  background: var(--hp-green);
}
.damage-title-line {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 900;
}
.damage-breakdown-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 8px;
}
.damage-breakdown-item {
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg-card);
  padding: 8px;
}
.damage-breakdown-item strong {
  display: block;
  color: var(--text-primary);
  font-size: 12px;
}
.damage-breakdown-item span {
  display: block;
  color: var(--text-secondary);
  font-size: 11px;
  margin-top: 3px;
}
.damage-formula {
  margin-top: 10px;
  border: 1px dashed var(--border-strong);
  border-radius: 7px;
  background: rgba(255,255,255,.55);
  color: var(--text-secondary);
  padding: 9px;
  font-size: 11px;
  line-height: 1.6;
}
@media(max-width:860px) {
  .tools-layout { grid-template-columns: 1fr; }
  .tools-sidebar { position: static; }
  .query-bar,
  .hatch-form-grid,
  .type-form-grid,
  .damage-layout,
  .damage-result-layout,
  .damage-fields { grid-template-columns: 1fr; }
  .panel-head { flex-direction: column; }
}
</style>
</head>
<body>
<div class="page-shell">
  <header class="roco-topbar">
    <img class="logo" src="assets/img/logo.png" alt="洛克王国">
    <div class="title">工具</div>
    <nav class="app-nav">
      <a href="/dex">图鉴</a>
      <a href="/skills">技能</a>
      <a href="/mechanics">机制</a>
      <a href="/tools" class="active">工具</a>
      <a href="/storage">仓库</a>
      <a href="/simulator">队伍</a>
      <a href="/battle">对战</a>
    </nav>
  </header>

  <main class="page-main">
    <div class="tools-layout">
      <aside class="tools-sidebar">
        <div class="tools-kicker">工具列表</div>
        <button class="tool-link" type="button" data-tool="egg-group">
          <span><strong>蛋组查询器</strong><span>母族 / 蛋组</span></span>
          <b class="tool-badge">资料</b>
        </button>
        <button class="tool-link" type="button" data-tool="hatch-query">
          <span><strong>孵蛋查询器</strong><span>直径 / 体重</span></span>
          <b class="tool-badge">反查</b>
        </button>
        <button class="tool-link" type="button" data-tool="type-calc">
          <span><strong>克制计算器</strong><span>系别 / 关系图</span></span>
          <b class="tool-badge">克制</b>
        </button>
        <button class="tool-link" type="button" data-tool="damage-calc">
          <span><strong>伤害计算器</strong><span>面板 / 倍率</span></span>
          <b class="tool-badge">战斗</b>
        </button>
      </aside>

      <section class="tool-surface">
        <section id="panel-egg-group" class="tool-panel">
          <div class="panel-head">
            <div>
              <h1>蛋组查询器</h1>
              <p>按母族、形态或蛋组检索本地蛋组资料。</p>
            </div>
            <div id="egg-tool-count" class="panel-count">加载中...</div>
          </div>

          <div class="query-bar">
            <input id="egg-q" class="roco-input" placeholder="搜索母族、精灵、形态或蛋组" autocomplete="off">
            <select id="egg-group-select" class="roco-select">
              <option value="0">全部蛋组</option>
            </select>
            <button id="egg-search-btn" class="roco-btn" type="button">查询</button>
          </div>

          <div id="egg-group-strip" class="group-strip"></div>
          <div id="egg-result"></div>
        </section>

        <section id="panel-hatch-query" class="tool-panel" hidden>
          <div class="panel-head">
            <div>
              <h1>孵蛋查询器</h1>
              <p>输入蛋的直径和体重，按本地区间数据反查候选精灵。</p>
            </div>
            <div id="hatch-tool-count" class="panel-count">加载中...</div>
          </div>

          <div class="hint-line">仅使用区间数据匹配，不使用精确测量点参与筛选。</div>
          <div class="hatch-form">
            <div class="hatch-form-grid">
              <div class="field-stack">
                <label for="hatch-diameter">蛋直径 (m)</label>
                <input id="hatch-diameter" class="roco-input" type="number" min="0" step="0.001" placeholder="例如 0.35">
              </div>
              <div class="field-stack">
                <label for="hatch-weight">蛋体重 (kg)</label>

<script>
const toolPanels = {
  'egg-group': document.getElementById('panel-egg-group'),
  'hatch-query': document.getElementById('panel-hatch-query'),
  'type-calc': document.getElementById('panel-type-calc'),
  'damage-calc': document.getElementById('panel-damage-calc'),
};
const toolLinks = [...document.querySelectorAll('[data-tool]')];
const currentParams = new URLSearchParams(window.location.search);
let currentTool = currentParams.get('tool') || 'egg-group';
if(!toolPanels[currentTool]) currentTool = 'egg-group';

const eggState = { q: '', groupId: 0, page: 1, pageSize: 24, groups: [], payload: null, timer: null, inited: false };
const hatchState = { inited: false, payload: null };
const typeState = { inited: false, types: [], matrix: [], payload: null };
const damageState = { inited: false, options: null, payload: null };

const eggEls = {
  q: document.getElementById('egg-q'),
  groupSelect: document.getElementById('egg-group-select'),
  groupStrip: document.getElementById('egg-group-strip'),
  result: document.getElementById('egg-result'),
  count: document.getElementById('egg-tool-count'),
};
const hatchEls = {
  diameter: document.getElementById('hatch-diameter'),
  weight: document.getElementById('hatch-weight'),
  result: document.getElementById('hatch-result'),
  count: document.getElementById('hatch-tool-count'),
};
const typeEls = {
  chart: document.getElementById('type-chart'),
  attack: document.getElementById('type-attack'),
  defenseA: document.getElementById('type-defense-a'),
  defenseB: document.getElementById('type-defense-b'),
  result: document.getElementById('type-result'),
  count: document.getElementById('type-tool-count'),
};
const damageEls = {
  attacker: document.getElementById('damage-attacker'),
  attackerNature: document.getElementById('damage-attacker-nature'),
  attackerNatureEffect: document.getElementById('damage-attacker-nature-effect'),
  attackerPreview: document.getElementById('damage-attacker-preview'),
  defender: document.getElementById('damage-defender'),
  defenderNature: document.getElementById('damage-defender-nature'),
  defenderNatureEffect: document.getElementById('damage-defender-nature-effect'),
  defenderPreview: document.getElementById('damage-defender-preview'),
  skill: document.getElementById('damage-skill'),
  attackSkillIcon: document.getElementById('damage-attack-skill-icon'),
  skillType: document.getElementById('damage-skill-type'),
  skillCategory: document.getElementById('damage-skill-category'),
  power: document.getElementById('damage-power'),
  hitCount: document.getElementById('damage-hit-count'),
  weather: document.getElementById('damage-weather'),
  bloodline: document.getElementById('damage-bloodline'),
  defenderBloodline: document.getElementById('damage-defender-bloodline'),
  defenseSkill: document.getElementById('damage-defense-skill'),
  defenseSkillIcon: document.getElementById('damage-defense-skill-icon'),
  willImpact: document.getElementById('damage-will-impact'),
  counterStatus: document.getElementById('damage-counter-status'),
  counterMult: document.getElementById('damage-counter-mult'),
  stab: document.getElementById('damage-stab'),
  barrel: document.getElementById('damage-barrel'),
  defenseType1: document.getElementById('damage-defense-type1'),
  defenseType2: document.getElementById('damage-defense-type2'),
  atkUp: document.getElementById('damage-atk-up'),
  atkDown: document.getElementById('damage-atk-down'),
  spatkUp: document.getElementById('damage-spatk-up'),
  spatkDown: document.getElementById('damage-spatk-down'),
  powerMult: document.getElementById('damage-power-mult'),
  skillPowerBonus: document.getElementById('damage-skill-power-bonus'),
  skillPowerPct: document.getElementById('damage-skill-power-pct'),
  defUp: document.getElementById('damage-def-up'),
  defDown: document.getElementById('damage-def-down'),
  spdefUp: document.getElementById('damage-spdef-up'),
  spdefDown: document.getElementById('damage-spdef-down'),
  reduction: document.getElementById('damage-reduction'),
  hpPercent: document.getElementById('damage-hp-percent'),
  result: document.getElementById('damage-result'),
  count: document.getElementById('damage-tool-count'),
  pokemonList: document.getElementById('damage-pokemon-list'),
  skillList: document.getElementById('damage-skill-list')
};

function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function toFixedText(value){
  const num = Number(value);
  if(!Number.isFinite(num)) return '';
  return num.toFixed(3).replace(/\.?0+$/, '');
}
function parsePositive(el){
  const value = Number(el.value);
  return Number.isFinite(value) && value > 0 ? value : null;
}
function typeIcon(type, className = 'type-icon'){
  if(!type || !type.icon_url) return '';
  return `<img class="${className}" src="${esc(type.icon_url)}" alt="${esc(type.name)}">`;
}
function typeLabel(type){
  return `<span class="type-head">${typeIcon(type)}${esc(type?.name || '')}</span>`;
}
function multiplierText(value){
  const num = Number(value);
  if(!Number.isFinite(num)) return '';
  return Number.isInteger(num) ? `${num}` : String(num);
}
function multiplierClass(value){
  const num = Number(value);
  if(num > 1) return 'super';
  if(num < 1) return 'resist';
  return 'neutral';
}

function setTool(tool, updateUrl = true){
  currentTool = toolPanels[tool] ? tool : 'egg-group';
  toolLinks.forEach(button => button.classList.toggle('active', button.dataset.tool === currentTool));
  Object.entries(toolPanels).forEach(([key, panel]) => panel.hidden = key !== currentTool);
  if(updateUrl){
    const next = new URL(window.location.href);
    next.searchParams.set('tool', currentTool);
    history.replaceState(null, '', next.toString());
  }
  if(currentTool === 'egg-group') initEggTool();
  if(currentTool === 'hatch-query') initHatchTool();
  if(currentTool === 'type-calc') initTypeTool();
  if(currentTool === 'damage-calc') initDamageTool();
}

function eggPageName(card){
  const rep = card.representative || {};
  return rep.page_name || rep.display_name || card.mother_family || '';
}
function eggHatchable(card){
  const rep = card.representative || {};
  return Number(card.can_hatch_member_count || 0) > 0 && !String(rep.hatch_status_text || '').includes('暂不');
}
function eggCurrentGroupName(){
  if(!eggState.groupId) return '全部蛋组';
  const group = eggState.groups.find(g => Number(g.group_id) === Number(eggState.groupId));
  return group ? group.group_display : '当前蛋组';
}

async function loadEggGroups(){
  const res = await fetch('/api/egg-groups');
  const payload = await res.json();
  eggState.groups = Array.isArray(payload.groups) ? payload.groups : [];
  eggEls.count.textContent = `${eggState.groups.length} 个蛋组`;
  eggEls.groupSelect.innerHTML = '<option value="0">全部蛋组</option>' + eggState.groups.map(group =>
    `<option value="${esc(group.group_id)}">${esc(group.group_display)}（${esc(group.folded_count || group.member_count || 0)}）</option>`
  ).join('');
  renderEggGroupStrip();
}

function renderEggGroupStrip(){
  eggEls.groupStrip.innerHTML = [
    `<button class="group-pill ${eggState.groupId ? '' : 'active'}" data-gid="0"><strong>全部蛋组</strong><span>${eggState.groups.length} 组</span></button>`,
    ...eggState.groups.map(group => `
      <button class="group-pill ${Number(group.group_id) === Number(eggState.groupId) ? 'active' : ''}" data-gid="${esc(group.group_id)}">
        <strong>${esc(group.group_display)}</strong>
        <span>${esc(group.folded_count || 0)} 母族 / ${esc(group.member_count || 0)} 精灵</span>
      </button>
    `),
  ].join('');
}

async function loadEggMembers(){
  eggEls.result.innerHTML = '<div class="empty-state">加载中...</div>';
  const params = new URLSearchParams({
    group_id: String(eggState.groupId || 0),
    q: eggState.q,
    page: String(eggState.page),
    page_size: String(eggState.pageSize),
  });
  const res = await fetch(`/api/egg-group-members?${params.toString()}`);
  eggState.payload = await res.json();
  renderEggGroupStrip();
  renderEggResult();
}

function renderEggResult(){
  const payload = eggState.payload || {};
  const cards = Array.isArray(payload.cards) ? payload.cards : [];
  const total = Number(payload.total_count || 0);
  const page = Number(payload.page || 1);
  const totalPages = Number(payload.total_pages || 1);
  const title = eggState.q ? `搜索：${eggState.q}` : eggCurrentGroupName();

  if(!cards.length){
    eggEls.result.innerHTML = `
      <div class="result-head"><h2>${esc(title)}</h2><span>0 个结果</span></div>
      <div class="empty-state">没有匹配的母族</div>
    `;
    return;
  }

  const grid = cards.map(card => {
    const rep = card.representative || {};
    const avatar = rep.local_avatar_url || rep.avatar_url || '';
    const name = eggPageName(card);
    const chain = (card.family_members || []).slice(0, 6).map(item => `<span class="chain-chip">${esc(item)}</span>`).join('');
    const more = (card.family_members || []).length > 6 ? `<span class="chain-chip">+${esc((card.family_members || []).length - 6)}</span>` : '';
    return `
      <article class="member-card">
        <img class="member-avatar" src="${esc(avatar)}" alt="${esc(name)}" loading="lazy">
        <div>
          <div class="member-title">
            <a href="/dex?pokemon=${encodeURIComponent(name)}">${esc(name)}</a>
            <span class="group-tag">${esc(card.group_display || '')}</span>
          </div>
          <div class="member-meta">
            母族 ${esc(card.mother_family || '-')} · ${esc(rep.type_name || '未知元素')}<br>
            ${esc(card.family_chain || '')}
          </div>
          <div class="chain-row">${chain}${more}</div>
          <div class="chain-row">
            <span class="status-tag ${eggHatchable(card) ? 'ok' : ''}">${esc(rep.hatch_status_text || '未知状态')}</span>
            <span class="status-tag">${esc(card.member_count || 0)} 个形态</span>
          </div>
        </div>
      </article>
    `;
  }).join('');

  eggEls.result.innerHTML = `
    <div class="result-head">
      <h2>${esc(title)}</h2>
      <span>${esc(total)} 个母族 · 第 ${esc(page)} / ${esc(totalPages)} 页</span>
    </div>
    <div class="member-grid">${grid}</div>
    ${renderPagination(page, totalPages)}
  `;
}

function renderPagination(page, totalPages){
  if(totalPages <= 1) return '';
  const pages = [];
  const start = Math.max(1, page - 2);
  const end = Math.min(totalPages, page + 2);
  for(let i = start; i <= end; i++) pages.push(i);
  return `
    <div class="pagination">
      <button class="page-btn" data-page="${Math.max(1, page - 1)}" ${page <= 1 ? 'disabled' : ''}>上一页</button>

    </div>
  `;
}

const damageStatLabels = {
  hp: '生命',
  atk: '物攻',
  spatk: '魔攻',
  def: '物防',
  spdef: '魔防',
  speed: '速度',
};

function damageNumber(el, fallback = 0){
  const value = Number(el.value);
  return Number.isFinite(value) ? value : fallback;
}

function damagePct(el, fallback = 0){
  return damageNumber(el, fallback * 100) / 100;
}

function damageTypeById(typeId){
  const options = damageState.options || {};
  return (options.types || []).find(type => type.id === typeId) || {id: typeId, name: typeId, icon_url: ''};
}

function damageSelectedPokemon(select){
  const options = damageState.options || {};
  return (options.pokemon || []).find(item => item.name === select.value);
}

function damageSelectedSkill(){
  const options = damageState.options || {};
  return (options.skills || []).find(item => item.name === damageEls.skill.value);
}

function damageLearnsetFor(name){
  const options = damageState.options || {};
  return (options.learnsets || {})[name] || [];
}

function damageNatureByName(name){
  const options = damageState.options || {};
  return (options.natures || []).find(item => item.name === name);
}

function damageNatureHtml(name){
  const nature = damageNatureByName(name);
  const bonuses = nature ? (nature.bonuses || {}) : {};
  const chips = Object.entries({
    hp: bonuses.hp,
    atk: bonuses.atk,
    spatk: bonuses.sp_atk,
    def: bonuses.defense,
    spdef: bonuses.sp_defense,
    speed: bonuses.speed,
  }).filter(([, value]) => Number(value) !== 0)
    .map(([key, value]) => {
      const num = Number(value);
      const cls = num > 0 ? 'up' : 'down';
      const sign = num > 0 ? '+' : '';
      return `<span class="nature-chip ${cls}">${esc(damageStatLabels[key])}${sign}${Math.round(num * 100)}%</span>`;
    });
  return chips.join('') || '<span class="nature-chip">无修正</span>';
}

function damagePokemonTypes(pokemon){
  return (pokemon && Array.isArray(pokemon.types) && pokemon.types.length) ? pokemon.types : [pokemon?.type || 'normal'];
}

function damageBloodlineAllows(skill, bloodline, pokemon){
  if(!skill || !String(skill.learn_group || '').includes('血脉')) return true;
  if(!bloodline || bloodline === 'leader') return false;
  if(pokemon && pokemon.is_leader) return false;
  return skill.type === bloodline;
}

function damageAttackSkills(){
  const attacker = damageSelectedPokemon(damageEls.attacker);
  return damageLearnsetFor(damageEls.attacker.value)
    .filter(skill => ['物攻', '魔攻'].includes(skill.category))
    .filter(skill => Number(skill.power || 0) > 0)
    .filter(skill => damageBloodlineAllows(skill, damageEls.bloodline.value, attacker));
}

function damageDefenseSkills(){
  const defender = damageSelectedPokemon(damageEls.defender);
  const defenseSkills = damageLearnsetFor(damageEls.defender.value)
    .filter(skill => skill.category === '防御')
    .filter(skill => damageBloodlineAllows(skill, damageEls.defenderBloodline.value, defender));
  return [
    {name: '__status__', label: '状态类技能', category: '状态', type: '', power: 0, counter_target: 'status'},
    ...defenseSkills.map(skill => ({...skill, label: `${skill.name} · ${skill.type_name || skill.element || ''}`, counter_target: 'defense'})),
  ];
}

damageEls.pokemonList.innerHTML = pokemonHtml;

function setDamagePreferred(el, names){
  if(!el) return;

  const options = damageState.options || {};
  const id = el.id || '';

  let pool = [];

  if(id === 'damage-skill'){
    pool = (options.skills || [])
      .map(item => item.name)
      .filter(Boolean);
  } else if(id === 'damage-attacker' || id === 'damage-defender'){
    pool = (options.pokemon || [])
      .map(item => item.name)
      .filter(Boolean);
  } else if(el.tagName === 'SELECT'){
    pool = [...el.options]
      .map(option => option.value)
      .filter(Boolean);
  }

  if(!pool.length) return;

  const available = new Set(pool);
  const found = names.find(name => available.has(name));

  if(found){
    el.value = found;
  } else if(!el.value){
    el.value = pool[0];
  }
}

function fillDamageAttackSkillList(){

      </option>
    `)

}

function fillDamageDefenseSkillSelect(){

function renderDamageSkillIcon(target, skill, fallbackText){
  if(!target) return target;
  const id = target.id;
  const icon = skill && skill.icon_url ? skill.icon_url : '';
  if(icon){
    target.outerHTML = `<img id="${esc(id)}" class="damage-skill-icon" src="${esc(icon)}" alt="${esc(skill.name || '')}">`;
  } else {
    target.outerHTML = `<span id="${esc(id)}" class="damage-skill-icon empty">${esc(fallbackText)}</span>`;
  }
  return document.getElementById(id);
}

function syncDamageSkillIcons(){
  const attackSkill = damageEls.willImpact.checked && !damageEls.willImpact.disabled ? null : damageSelectedSkill();
  damageEls.attackSkillIcon = renderDamageSkillIcon(damageEls.attackSkillIcon, attackSkill, damageEls.willImpact.checked ? '愿力' : '攻击');
  const defenseSkill = damageDefenseSkillMeta();
  damageEls.defenseSkillIcon = renderDamageSkillIcon(damageEls.defenseSkillIcon, defenseSkill, defenseSkill.name === '__status__' ? '状态' : '防御');
}

function syncDamagePokemonPreview(which){
  const isAttacker = which === 'attacker';
  const pokemon = damageSelectedPokemon(isAttacker ? damageEls.attacker : damageEls.defender);
  const target = isAttacker ? damageEls.attackerPreview : damageEls.defenderPreview;

    target.innerHTML = '<span>请选择精灵</span>';
    return;
  }

    <img src="${esc(pokemon.icon_url || '')}" alt="${esc(pokemon.name)}">
    <div>
      <strong>${esc(pokemon.name)}</strong>
      <span>${pokemon.is_leader ? '首领形态 · ' : ''}${esc(pokemon.number || '')}${pokemon.base_total ? ` · 种族值 ${esc(pokemon.base_total)}` : ''}</span>
    </div>
  `;
}

function syncDamageNatureEffects(){
  damageEls.attackerNatureEffect.innerHTML = damageNatureHtml(damageEls.attackerNature.value);
  damageEls.defenderNatureEffect.innerHTML = damageNatureHtml(damageEls.defenderNature.value);
}

function syncDamagePokemonDefaults(){
  const attacker = damageSelectedPokemon(damageEls.attacker);
  const defender = damageSelectedPokemon(damageEls.defender);
  if(attacker) damageEls.bloodline.value = attacker.type || 'normal';
  if(defender){
    damageEls.defenderBloodline.value = defender.type || 'normal';
    const defenderTypes = damagePokemonTypes(defender);
    damageEls.defenseType1.value = defenderTypes[0] || 'normal';
    damageEls.defenseType2.value = defenderTypes[1] || '';
  }
  syncDamagePokemonPreview('attacker');
  syncDamagePokemonPreview('defender');
  syncDamageNatureEffects();
  fillDamageAttackSkillList();
  fillDamageDefenseSkillSelect();
}

function syncDamageSkillFields(){
  const allowed = damageAttackSkills();
  if(allowed.length && !allowed.some(item => item.name === damageEls.skill.value)){
    damageEls.skill.value = allowed[0].name;
  }
  const skill = damageSelectedSkill();
  if(skill){
    damageEls.skillType.value = skill.type || 'normal';
    damageEls.skillCategory.value = skill.category || '物攻';
    damageEls.power.value = Number(skill.power || 0);
    damageEls.hitCount.value = Number(skill.hit_count || 1);
  }
  syncDamageWillFields();
  syncDamageCounterFields();
  syncDamageStabField();
  syncDamageSkillIcons();
}

function syncDamageWillFields(){
  const attacker = damageSelectedPokemon(damageEls.attacker);
  const blocked = Boolean(attacker && attacker.is_leader) || !damageEls.bloodline.value || damageEls.bloodline.value === 'leader';
  damageEls.willImpact.disabled = blocked;
  damageEls.willImpact.closest('.damage-check')?.classList.toggle('disabled', blocked);
  if(blocked){
    damageEls.willImpact.checked = false;
  }
  const enabled = damageEls.willImpact.checked && !blocked;
  if(!enabled){
    return;
  }
  if(attacker && !damageEls.bloodline.value) damageEls.bloodline.value = attacker.type || 'normal';
  damageEls.skillType.value = damageEls.bloodline.value || damageEls.skillType.value;
  damageEls.power.value = 80;
  damageEls.hitCount.value = 1;
}

function syncDamageStabField(){
  const attacker = damageSelectedPokemon(damageEls.attacker);
  const attackerTypes = damagePokemonTypes(attacker);
  const hasStab = attackerTypes.includes(damageEls.skillType.value);
  damageEls.stab.checked = hasStab;
  damageEls.stab.disabled = true;
  damageEls.stab.closest('.damage-check')?.classList.toggle('disabled', true);
}

function damageDefenseSkillMeta(){
  return damageDefenseSkills().find(skill => skill.name === damageEls.defenseSkill.value) || {counter_target: 'status'};
}

function syncDamageCounterFields(){
  const selectedSkill = damageSelectedSkill();
  const defenseSkill = damageDefenseSkillMeta();
  const target = defenseSkill.counter_target || 'status';
  let canCounter = false;
  let multiplier = 1;

  if(damageEls.willImpact.checked && !damageEls.willImpact.disabled && target === 'status'){
    canCounter = true;
    multiplier = 2.5;
  } else if(selectedSkill && selectedSkill.counter && selectedSkill.counter[target]){
    canCounter = Boolean(selectedSkill.counter[target].can_counter);
    multiplier = Number(selectedSkill.counter[target].multiplier || 1);
  }

  if(target === 'status'){
    damageEls.counterStatus.checked = canCounter;
    damageEls.counterStatus.disabled = !canCounter;
  } else {
    damageEls.counterStatus.checked = false;
    damageEls.counterStatus.disabled = true;
  }
  damageEls.counterStatus.closest('.damage-check')?.classList.toggle('disabled', damageEls.counterStatus.disabled);
  damageEls.counterMult.value = canCounter ? multiplier : 1;
}

function readDamageIv(prefix){
  const iv = {hp:0, atk:0, spatk:0, def:0, spdef:0, speed:0};
  document.querySelectorAll(`[data-damage-iv^="${prefix}:"]`).forEach(input => {
    const key = input.dataset.damageIv.split(':')[1];
    iv[key] = input.checked ? 60 : 0;
  });
  return iv;
}

function collectDamagePayload(){
  return {
    attacker: {
      name: damageEls.attacker.value,
      nature: damageEls.attackerNature.value,
      iv: readDamageIv('attacker'),
      bloodline: damageEls.bloodline.value,
    },
    defender: {
      name: damageEls.defender.value,
      nature: damageEls.defenderNature.value,
      iv: readDamageIv('defender'),
      bloodline: damageEls.defenderBloodline.value,
      defense_skill: damageEls.defenseSkill.value,
    },
    skill: {
      name: damageEls.skill.value,
      type: damageEls.skillType.value,
      category: damageEls.skillCategory.value,
      power: damageNumber(damageEls.power, 80),
      hit_count: damageNumber(damageEls.hitCount, 1),
      bloodline: damageEls.bloodline.value,
      will_impact: damageEls.willImpact.checked,
      counter_status: damageEls.counterStatus.checked,
      counter_multiplier: damageNumber(damageEls.counterMult, 1),
    },
    attacker_mods: {
      atk_up: damagePct(damageEls.atkUp),
      atk_down: damagePct(damageEls.atkDown),
      spatk_up: damagePct(damageEls.spatkUp),
      spatk_down: damagePct(damageEls.spatkDown),
      power_multiplier: 1 + damagePct(damageEls.powerMult),
      skill_power_bonus: damageNumber(damageEls.skillPowerBonus, 0),
      skill_power_pct_mod: damagePct(damageEls.skillPowerPct),
    },
    defender_mods: {
      def_up: damagePct(damageEls.defUp),
      def_down: damagePct(damageEls.defDown),
      spdef_up: damagePct(damageEls.spdefUp),
      spdef_down: damagePct(damageEls.spdefDown),
      damage_reduction: damagePct(damageEls.reduction),
      hp_percent: damagePct(damageEls.hpPercent, 1),
    },
    field: {
      weather: damageEls.weather.value,
      defense_type1: damageEls.defenseType1.value,
      defense_type2: damageEls.defenseType2.value,
      stab_enabled: damageEls.stab.checked,
      barrel_active: damageEls.barrel.checked,
    },
  };
}

function damageTypePill(typeId){
  return typePill({type: damageTypeById(typeId), multiplier: 1}).replace('type-pill neutral', 'type-pill');
}

function renderDamageResult(payload){
  if(!payload || !payload.ok){
    renderDamagePrompt(payload && payload.error ? payload.error : '伤害计算失败。');
    return;
  }
  const skillType = damageTypeById(payload.skill.type);
  const defenderTypes = (payload.field.effectiveness_parts || []).map(item => damageTypeById(item.type));
  const remainingPct = Math.max(0, Math.min(100, payload.remaining_hp / Math.max(1, payload.current_hp) * 100));
  const breakdown = (payload.breakdown || []).map(item => `
    <div class="damage-breakdown-item">
      <strong>${esc(item.label)}</strong>
      <span>${esc(item.value)}</span>
    </div>
  `).join('');
  const formulaSteps = ((payload.formula && payload.formula.steps) || []).map(step => `
    <div><strong>${esc(step.label)}：</strong>${esc(step.value)}</div>
  `).join('');
  const totalFormula = payload.formula && payload.formula.total_damage
    ? `<div><strong>总伤害公式：</strong>${esc(payload.formula.total_damage)}</div>`
    : '';

  damageEls.result.innerHTML = `
    <div class="result-head">
      <h2>${esc(payload.attacker.name)} 使用 ${esc(payload.skill.name)}</h2>
      <span>${esc(payload.axis.attack)} → ${esc(payload.axis.defense)}</span>
    </div>
    <div class="damage-result-layout">
      <section class="damage-summary">
        <div class="damage-number">${esc(payload.damage)}</div>
        <div class="damage-summary-meta">
          ${payload.ko ? '可以击倒' : `剩余 ${esc(payload.remaining_hp)} / ${esc(payload.current_hp)} HP`}<br>
          对最大生命约 ${esc(Math.round((payload.hp_percent || 0) * 1000) / 10)}%
        </div>
        <div class="damage-hpbar"><span style="width:${remainingPct}%"></span></div>
      </section>
      <section class="damage-detail">
        <div class="damage-title-line">
          ${typeIcon(skillType)}
          <span>${esc(payload.skill.type_name)} · ${esc(payload.skill.category)} · 威力 ${esc(payload.skill.power)}</span>
          <span>→</span>
          ${defenderTypes.map(type => typeLabel(type)).join('')}
          <span>克制 x${esc(multiplierText(payload.field.effectiveness))}</span>
        </div>
        <div class="damage-breakdown-grid">${breakdown}</div>
        <div class="damage-formula">
          ${formulaSteps || `公式拆解：${esc(payload.formula.detail)}`}
          ${totalFormula}<br>
          取整前 ${esc(payload.raw_damage)}，减伤前 ${esc(payload.damage_before_reduction)}。
        </div>
      </section>
    </div>
  `;
}

async function runDamageCalc(){
  if(!damageState.inited) return;
  syncDamageSkillFields();
  syncDamageWillFields();
  syncDamageCounterFields();
  syncDamageStabField();
  damageEls.result.innerHTML = '<div class="empty-state">计算中...</div>';
  const res = await fetch('/api/damage-calculator/calculate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(collectDamagePayload()),
  });
  const payload = await res.json();
  damageState.payload = payload;
  renderDamageResult(payload);
}

async function initDamageTool(){
  if(damageState.inited) return;
  const res = await fetch('/api/damage-calculator/options');
  const payload = await res.json();
  damageState.options = payload;
  damageEls.count.textContent = `${(payload.pokemon || []).length} 精灵 · ${(payload.skills || []).length} 技能`;
  fillDamageOptions();
  setDamagePreferred(damageEls.attacker, ['恶魔狼', '音速犬', '圣羽翼王']);
  setDamagePreferred(damageEls.defender, ['燃薪虫', '蹦蹦种子', '瞌睡王']);
  setDamagePreferred(damageEls.skill, ['火焰冲击', '暗突袭', '毒沼']);
  damageEls.attackerNature.value = '热情';
  damageEls.defenderNature.value = '固执';
  syncDamagePokemonDefaults();
  syncDamageSkillFields();
  renderDamagePrompt('调整配置后点击“计算伤害”。');
  damageState.inited = true;
  await runDamageCalc();
}

toolLinks.forEach(button => {
  button.addEventListener('click', () => setTool(button.dataset.tool));
});

eggEls.q.addEventListener('input', () => {
  clearTimeout(eggState.timer);
  eggState.q = eggEls.q.value.trim();
  eggState.page = 1;
  eggState.timer = setTimeout(loadEggMembers, 180);
});
document.getElementById('egg-search-btn').addEventListener('click', () => {
  eggState.q = eggEls.q.value.trim();
  eggState.page = 1;
  loadEggMembers();
});
eggEls.groupSelect.addEventListener('change', () => {
  eggState.groupId = Number(eggEls.groupSelect.value) || 0;
  eggState.page = 1;
  loadEggMembers();
});
eggEls.groupStrip.addEventListener('click', event => {
  const button = event.target.closest('button[data-gid]');
  if(!button) return;
  eggState.groupId = Number(button.dataset.gid) || 0;
  eggEls.groupSelect.value = String(eggState.groupId);
  eggState.page = 1;
  loadEggMembers();
});
eggEls.result.addEventListener('click', event => {
  const button = event.target.closest('button[data-page]');
  if(!button || button.disabled) return;
  eggState.page = Number(button.dataset.page) || 1;
  loadEggMembers();
});

document.getElementById('hatch-search-btn').addEventListener('click', runHatchQuery);
[hatchEls.diameter, hatchEls.weight].forEach(input => {
  input.addEventListener('keydown', event => {
    if(event.key === 'Enter') runHatchQuery();
  });
});

[typeEls.attack, typeEls.defenseA, typeEls.defenseB].forEach(select => {
  select.addEventListener('change', runTypeCalc);
});
document.getElementById('type-clear-btn').addEventListener('click', () => {
  typeEls.attack.value = '';
  typeEls.defenseA.value = '';
  typeEls.defenseB.value = '';
  runTypeCalc();
});

document.getElementById('damage-calc-btn').addEventListener('click', runDamageCalc);
function bindDamageSkillSearch(){
  damageEls.skill.addEventListener('input', () => {
    const skill = damageSelectedSkill();

    if(skill){
      syncDamageSkillFields();
      if(damageState.inited) runDamageCalc();
    } else {
      syncDamageSkillIcons();
    }
  });

  damageEls.skill.addEventListener('change', () => {
    syncDamageSkillFields();
    if(damageState.inited) runDamageCalc();
  });
}

bindDamageSkillSearch();

function bindDamagePokemonSearch(){
  damageEls.attacker.addEventListener('input', () => {
    const attacker = damageSelectedPokemon(damageEls.attacker);
    if(attacker) damageEls.bloodline.value = attacker.type || 'normal';
    syncDamagePokemonPreview('attacker');
    fillDamageAttackSkillList();
    syncDamageSkillFields();
    syncDamageWillFields();
    if(damageState.inited && attacker) runDamageCalc();
  });

  damageEls.attacker.addEventListener('change', () => {
    const attacker = damageSelectedPokemon(damageEls.attacker);
    if(attacker) damageEls.bloodline.value = attacker.type || 'normal';
    syncDamagePokemonPreview('attacker');
    fillDamageAttackSkillList();
    syncDamageSkillFields();
    syncDamageWillFields();
    if(damageState.inited && attacker) runDamageCalc();
  });

  damageEls.defender.addEventListener('input', () => {
    const defender = damageSelectedPokemon(damageEls.defender);
    if(defender){
      damageEls.defenderBloodline.value = defender.type || 'normal';
      const defenderTypes = damagePokemonTypes(defender);
      damageEls.defenseType1.value = defenderTypes[0] || 'normal';
      damageEls.defenseType2.value = defenderTypes[1] || '';
    }
    syncDamagePokemonPreview('defender');
    fillDamageDefenseSkillSelect();
    syncDamageCounterFields();
    if(damageState.inited && defender) runDamageCalc();
  });

  damageEls.defender.addEventListener('change', () => {
    const defender = damageSelectedPokemon(damageEls.defender);
    if(defender){
      damageEls.defenderBloodline.value = defender.type || 'normal';
      const defenderTypes = damagePokemonTypes(defender);
      damageEls.defenseType1.value = defenderTypes[0] || 'normal';
      damageEls.defenseType2.value = defenderTypes[1] || '';
    }
    syncDamagePokemonPreview('defender');
    fillDamageDefenseSkillSelect();
    syncDamageCounterFields();
    if(damageState.inited && defender) runDamageCalc();
  });
}
bindDamagePokemonSearch();

damageEls.willImpact.addEventListener('change', () => {
  syncDamageWillFields();
  syncDamageCounterFields();
  syncDamageStabField();
  syncDamageSkillIcons();
  if(damageState.inited) runDamageCalc();
});
damageEls.bloodline.addEventListener('change', () => {
  fillDamageAttackSkillList();
  syncDamageWillFields();
  syncDamageSkillFields();
  if(damageState.inited) runDamageCalc();
});
damageEls.defenderBloodline.addEventListener('change', () => {
  fillDamageDefenseSkillSelect();
  syncDamageCounterFields();
  if(damageState.inited) runDamageCalc();
});
damageEls.defenseSkill.addEventListener('change', () => {
  syncDamageCounterFields();
  syncDamageSkillIcons();
  if(damageState.inited) runDamageCalc();
});
[
  damageEls.attackerNature, damageEls.defenderNature, damageEls.skillType,
  damageEls.skillCategory, damageEls.power, damageEls.hitCount, damageEls.weather,
  damageEls.counterStatus, damageEls.stab, damageEls.barrel, damageEls.defenseType1,
  damageEls.defenseType2, damageEls.atkUp, damageEls.atkDown, damageEls.spatkUp,
  damageEls.spatkDown, damageEls.powerMult, damageEls.skillPowerBonus,
  damageEls.skillPowerPct, damageEls.defUp, damageEls.defDown, damageEls.spdefUp,
  damageEls.spdefDown, damageEls.reduction, damageEls.hpPercent,
  ...document.querySelectorAll('[data-damage-iv]'),
].forEach(el => {
  el.addEventListener('change', () => {
    syncDamageNatureEffects();
    syncDamageCounterFields();
    syncDamageStabField();
    if(damageState.inited) runDamageCalc();
  });
});

setTool(currentTool, false);
</script>
</body>
</html>
