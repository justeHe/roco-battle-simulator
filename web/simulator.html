<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛克王国 · 队伍</title>
<link rel="stylesheet" href="theme.css">
<style>
body { height: 100vh; overflow: hidden; }
.page-shell { height: 100vh; display: flex; flex-direction: column; }
.page-main { flex: 1; min-height: 0; padding: 14px; }
.team-page { height: 100%; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 12px; }
.lineup-list-pane, .lineup-detail-pane {
  min-height: 0;
  background: rgba(245,237,224,.72);
  border: 2px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.lineup-list-pane { display: flex; flex-direction: column; }
.lineup-toolbar { padding: 12px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.54); }
.toolbar-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.toolbar-row:first-child { margin-top: 0; }
.roco-input, .roco-select {
  width: 100%;
  min-width: 0;
  background: var(--bg-input);
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 12px;
  outline: none;
  padding: 8px 10px;
}
.roco-input:focus, .roco-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(245,166,35,.14); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button, .small-btn, .primary-btn {
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--bg-input);
  color: var(--text-primary);
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 800;
  padding: 7px 10px;
}
.seg button.active, .primary-btn { background: var(--title-bg); border-color: var(--title-bg); color: var(--text-light); }
.small-btn:hover, .seg button:hover { border-color: var(--primary); color: var(--primary-dark); }
.lineup-count { color: var(--text-secondary); font-size: 11px; white-space: nowrap; }
.lineup-list { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.lineup-card {
  width: 100%;
  text-align: left;
  border: 2px solid var(--border);
  border-radius: var(--r-md);
  background: var(--bg-input);
  padding: 10px;
  cursor: pointer;
  transition: border-color .16s, transform .16s, box-shadow .16s;
}
.lineup-card:hover, .lineup-card.active { border-color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.card-head { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 9px; align-items: center; }
.magic-icon { width: 42px; height: 42px; object-fit: contain; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 4px; }
.lineup-name { font-size: 14px; font-weight: 900; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lineup-meta { display: flex; gap: 6px; align-items: center; margin-top: 4px; color: var(--text-secondary); font-size: 10px; min-width: 0; }
.pill { border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--bg-card); padding: 2px 7px; font-size: 10px; font-weight: 800; color: var(--text-secondary); white-space: nowrap; }
.pill.dark { background: var(--title-bg); border-color: var(--title-bg); color: var(--text-light); }
.avatar-row { display: flex; gap: 4px; margin-top: 9px; min-height: 34px; }
.mini-avatar { width: 32px; height: 32px; object-fit: contain; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 2px; }
.card-actions-row { display: flex; justify-content: flex-end; gap: 5px; margin-top: 8px; }
.lineup-detail-pane { overflow-y: auto; padding: 16px; }
.detail-empty { height: 100%; display: grid; place-items: center; color: var(--text-secondary); font-size: 13px; }
.detail-head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: start; }
.detail-title { font-family: 'RocoTitle','RocoBody',system-ui,sans-serif; font-size: 24px; line-height: 1.1; color: var(--text-primary); }
.detail-sub { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.detail-actions { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
.desc { margin-top: 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: rgba(255,255,255,.64); padding: 11px 12px; color: var(--text-secondary); font-size: 13px; line-height: 1.7; }
.pickbar { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-input); padding: 10px; }
.pickbar b { color: var(--text-primary); }
.members { margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.member {
  background: var(--bg-input);
  border: 2px solid var(--border);
  border-radius: var(--r-md);
  padding: 10px;
  min-width: 0;
}
.member-top { display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 9px; align-items: center; }
.member-avatar { width: 54px; height: 54px; object-fit: contain; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 3px; }
.member-name { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.member-meta { margin-top: 4px; display: flex; gap: 5px; flex-wrap: wrap; }
.type-icon { width: 20px; height: 20px; object-fit: contain; vertical-align: middle; }
.type-chip { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--bg-card); padding: 2px 7px; color: var(--text-secondary); font-size: 10px; font-weight: 800; }
.config-line { margin-top: 8px; color: var(--text-secondary); font-size: 11px; display: flex; gap: 6px; flex-wrap: wrap; }
.skills { margin-top: 8px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 5px; }
.skill-chip { min-width: 0; display: flex; align-items: center; gap: 5px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--bg-card); padding: 4px 6px; color: var(--text-primary); font-size: 11px; }
.skill-icon { width: 22px; height: 22px; object-fit: contain; flex: 0 0 auto; }
.skill-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty-line { color: var(--text-muted); padding: 18px; text-align: center; }
@media (max-width: 1080px) {
  body { height: auto; overflow: auto; }
  .page-shell { height: auto; min-height: 100vh; }
  .team-page { grid-template-columns: 1fr; }
  .lineup-list-pane { min-height: 440px; }
  .members { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="page-shell">
  <header class="roco-topbar">
    <img class="logo" src="assets/img/logo.png" alt="洛克王国">
    <div class="title">队伍阵容</div>
    <nav class="app-nav">
      <a href="/dex">图鉴</a>
      <a href="/skills">技能</a>
      <a href="/mechanics">机制</a>
      <a href="/tools">工具</a>
      <a href="/storage">仓库</a>
      <a href="/simulator" class="active">队伍</a>
      <a href="/battle">对战</a>
    </nav>
  </header>
  <main class="page-main">
    <div class="team-page">
      <aside class="lineup-list-pane">
        <div class="lineup-toolbar">
          <input id="q" class="roco-input" placeholder="搜索队名、精灵、技能、作者" autocomplete="off">
          <div class="toolbar-row">
            <select id="magic-filter" class="roco-select"></select>
            <span id="count" class="lineup-count">—</span>
          </div>
          <div class="toolbar-row seg">
            <button data-source="all" class="active">全部</button>
            <button data-source="pvp">PVP</button>
            <button data-source="user">我的</button>
          </div>
        </div>
        <div id="lineup-list" class="lineup-list"></div>
      </aside>
      <section id="detail" class="lineup-detail-pane">
        <div class="detail-empty">正在加载阵容库…</div>
      </section>
    </div>
  </main>
</div>

<script>
const USER_TEAMS_KEY = 'roco_user_teams_v2';
const STORAGE_KEY = 'roco_spirit_storage_v2';
const PICKS_KEY = 'roco_battle_picks_v1';
const ALLOWED_MAGIC = new Set(['强化术', '进化之力']);
let pvpLineups = [];
let userLineups = [];
let activeSource = 'all';
let selectedKey = '';
let picks = loadJson(PICKS_KEY, { a: null, b: null });

function esc(v){ return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function loadJson(key, fallback){ try { return JSON.parse(localStorage.getItem(key) || '') || fallback; } catch { return fallback; } }
function saveJson(key, value){ localStorage.setItem(key, JSON.stringify(value)); }
function elementIconUrl(name){ return name ? `/skill-meta-icons/elements/${encodeURIComponent(name)}.png` : ''; }
function bloodlineIconUrl(name){ return name === '首领' ? '/lineup-icons/%E9%A6%96%E9%A2%86%E8%A1%80%E8%84%89.svg' : elementIconUrl(name); }
function magicLabel(value){ return value === '强化术' ? '愿力冲击' : (value || '未配置'); }
function sourceLabel(lineup){ return lineup.source_type === 'user' ? '我的配队' : 'PVP'; }
function lineupKey(lineup){ return `${lineup.source_type}:${lineup.id}`; }
function uniq(arr){ return [...new Set(arr.filter(Boolean))]; }
function hasCompleteLineupIcons(lineup){
  const members = lineup.members || [];
  return members.length === 6 && members.every(member => member.icon_url);
}
function isDisplayableLineup(lineup){
  return ALLOWED_MAGIC.has(lineup.magic) && hasCompleteLineupIcons(lineup);
}

async function init(){
  const res = await fetch('/api/lineups/pvp');
  const data = await res.json();
  pvpLineups = (data.lineups || []).map(item => normalizeLineup(item, 'pvp')).filter(isDisplayableLineup);
  loadUserLineups();
  setupFilters();
  renderMagicFilter();
  const first = filteredLineups()[0];
  if(first) selectedKey = lineupKey(first);
  renderList();
  renderDetail();
}

function normalizeLineup(item, source){
  return {
    ...item,
    id: item.id || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
    source_type: source,
    magic_label: item.magic_label || magicLabel(item.magic),
    members: (item.members || []).map((member, idx) => ({
      ...member,
      slot: member.slot || idx + 1,
      skills: member.skills || (member.skill_details || []).map(s => s.name).filter(Boolean),
      skill_details: member.skill_details || (member.skills || []).map(name => ({ name })),
    })),
  };
}

function loadUserLineups(){
  userLineups = loadJson(USER_TEAMS_KEY, []).map(item => normalizeLineup(item, 'user')).filter(isDisplayableLineup);
}

function setupFilters(){
  document.getElementById('q').addEventListener('input', () => { renderList(); renderDetail(); });
  document.getElementById('magic-filter').addEventListener('change', () => { renderList(); renderDetail(); });
  document.querySelectorAll('[data-source]').forEach(btn => {
    btn.onclick = () => {
      activeSource = btn.dataset.source;
      document.querySelectorAll('[data-source]').forEach(b => b.classList.toggle('active', b === btn));
      const rows = filteredLineups();
      if(!rows.some(row => lineupKey(row) === selectedKey)) selectedKey = rows[0] ? lineupKey(rows[0]) : '';
      renderList();
      renderDetail();
    };
  });
}

function renderMagicFilter(){
  const magics = uniq([...pvpLineups, ...userLineups].map(item => item.magic));
  document.getElementById('magic-filter').innerHTML = [
    '<option value="">全部血脉魔法</option>',
    ...magics.filter(value => ALLOWED_MAGIC.has(value)).map(value => `<option value="${esc(value)}">${esc(magicLabel(value))}</option>`)
  ].join('');
}

function allLineups(){ return [...userLineups, ...pvpLineups]; }
function searchText(lineup){
  const parts = [lineup.name, lineup.magic, lineup.magic_label, lineup.description, lineup.author, sourceLabel(lineup)];
  (lineup.members || []).forEach(m => parts.push(m.name, m.bloodline, m.nature, ...(m.iv_names || []), ...(m.skills || [])));
  return parts.join(' ').toLowerCase();
}
function filteredLineups(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const magic = document.getElementById('magic-filter').value;
  return allLineups().filter(lineup => {
    if(!isDisplayableLineup(lineup)) return false;
    if(activeSource !== 'all' && lineup.source_type !== activeSource) return false;
    if(magic && lineup.magic !== magic) return false;
    if(q && !searchText(lineup).includes(q)) return false;
    return true;
  });
}

function renderList(){
  loadUserLineups();
  const rows = filteredLineups();
  const wrap = document.getElementById('lineup-list');
  document.getElementById('count').textContent = `${rows.length} 队`;
  if(!rows.length){
    wrap.innerHTML = '<div class="empty-line">没有匹配的阵容</div>';
    return;
  }
  if(!rows.some(row => lineupKey(row) === selectedKey)) selectedKey = lineupKey(rows[0]);
  wrap.innerHTML = rows.map(lineup => `
    <article class="lineup-card ${lineupKey(lineup) === selectedKey ? 'active' : ''}" data-lineup-key="${esc(lineupKey(lineup))}">
      <div class="card-head">
        ${lineup.magic_icon_url ? `<img class="magic-icon" src="${esc(lineup.magic_icon_url)}" alt="${esc(lineup.magic_label)}">` : `<div class="magic-icon"></div>`}
        <div>
          <div class="lineup-name">${esc(lineup.name)}</div>
          <div class="lineup-meta">
            <span class="pill ${lineup.source_type === 'pvp' ? 'dark' : ''}">${esc(sourceLabel(lineup))}</span>
            <span>${esc(lineup.updated_at || '未记录日期')}</span>
          </div>
        </div>
      </div>
      <div class="avatar-row">${(lineup.members || []).slice(0,6).map(m => `<img class="mini-avatar" src="${esc(m.icon_url || '')}" alt="${esc(m.name)}">`).join('')}</div>
      ${lineup.source_type === 'user' ? `<div class="card-actions-row"><button class="small-btn" type="button" data-delete-lineup="${esc(lineup.id)}">删除</button></div>` : ''}
    </article>
  `).join('');
  wrap.querySelectorAll('[data-lineup-key]').forEach(card => {
    card.addEventListener('click', () => selectLineup(card.dataset.lineupKey));
  });
  wrap.querySelectorAll('[data-delete-lineup]').forEach(btn => {
    btn.addEventListener('click', event => {
      event.stopPropagation();
      deleteUserLineup(btn.dataset.deleteLineup);
    });
  });
}

function selectLineup(key){
  selectedKey = key;
  renderList();
  renderDetail();
}

function currentLineup(){
  return allLineups().find(lineup => lineupKey(lineup) === selectedKey) || filteredLineups()[0] || null;
}

function renderDetail(){
  const lineup = currentLineup();
  const detail = document.getElementById('detail');
  if(!lineup){
    detail.innerHTML = '<div class="detail-empty">没有可显示的阵容</div>';
    return;
  }
  const canBattle = lineup.members && lineup.members.length === 6;
  detail.innerHTML = `
    <div class="detail-head">
      <div>
        <div class="detail-title">${esc(lineup.name)}</div>
        <div class="detail-sub">
          <span class="pill ${lineup.source_type === 'pvp' ? 'dark' : ''}">${esc(sourceLabel(lineup))}</span>
          <span class="type-chip">${lineup.magic_icon_url ? `<img class="type-icon" src="${esc(lineup.magic_icon_url)}" alt="">` : ''}${esc(lineup.magic_label || magicLabel(lineup.magic))}</span>
          ${lineup.author ? `<span class="pill">作者 ${esc(lineup.author)}</span>` : ''}
          ${lineup.updated_at ? `<span class="pill">${esc(lineup.updated_at)}</span>` : ''}
        </div>
      </div>
      <div class="detail-actions">
        <button class="small-btn" onclick="saveLineupToStorage()">保存到仓库</button>
        ${lineup.source_type === 'user' ? '<button class="small-btn" onclick="deleteCurrentUserLineup()">删除配队</button>' : ''}
        <button class="small-btn" onclick="setBattleSide('a')" ${canBattle ? '' : 'disabled'}>设为我方</button>
        <button class="small-btn" onclick="setBattleSide('b')" ${canBattle ? '' : 'disabled'}>设为对方</button>
        <button class="primary-btn" onclick="startBattle()" ${picks.a && picks.b ? '' : 'disabled'}>开始对战</button>
      </div>
    </div>
    ${lineup.description ? `<div class="desc">${esc(lineup.description)}</div>` : ''}
    <div class="pickbar">
      <span>我方：<b>${esc(picks.a ? picks.a.name : '未选择')}</b></span>
      <span>对方：<b>${esc(picks.b ? picks.b.name : '未选择')}</b></span>
    </div>
    <div class="members">${(lineup.members || []).map(memberHtml).join('')}</div>
  `;
}

function memberHtml(member){
  const bloodIcon = bloodlineIconUrl(member.bloodline);
  const elementIcons = (member.element_icons || []).map(icon => `<img class="type-icon" src="${esc(icon.icon_url)}" alt="${esc(icon.name)}">`).join('');
  const skills = (member.skill_details || []).slice(0,4).map(skill => `
    <div class="skill-chip">
      ${skill.icon_url ? `<img class="skill-icon" src="${esc(skill.icon_url)}" alt="">` : ''}
      <span class="skill-name">${esc(skill.name)}</span>
    </div>
  `).join('');
  return `
    <article class="member">
      <div class="member-top">
        <img class="member-avatar" src="${esc(member.icon_url || '')}" alt="${esc(member.name)}">
        <div>
          <div class="member-name">${member.slot}. ${esc(member.name)}</div>
          <div class="member-meta">
            ${member.element ? `<span class="type-chip">${elementIcons}${esc(member.element)}</span>` : ''}
            ${member.bloodline ? `<span class="type-chip">${bloodIcon ? `<img class="type-icon" src="${esc(bloodIcon)}" alt="">` : ''}血脉 ${esc(member.bloodline)}</span>` : ''}
          </div>
        </div>
      </div>
      <div class="config-line">
        <span>性格：${esc(member.nature || '未配置')}</span>
        <span>个体：${esc((member.iv_names || []).join(' / ') || '未配置')}</span>
      </div>
      <div class="skills">${skills}</div>
    </article>
  `;
}

function battleTeam(lineup){
  return (lineup.members || []).map(member => ({
    name: member.name,
    nickname: member.nickname || '',
    ability: member.ability || '',
    skills: member.skills || [],
    iv_config: member.iv_config || null,
    nature: member.nature || '坦率',
    bloodline: member.bloodline || '',
    battle_item: lineup.magic || '',
  }));
}

function setBattleSide(side){
  const lineup = currentLineup();
  if(!lineup || !lineup.members || lineup.members.length !== 6) return;
  picks[side] = {
    id: lineup.id,
    source_type: lineup.source_type,
    name: lineup.name,
    magic: lineup.magic,
    team: battleTeam(lineup),
  };
  saveJson(PICKS_KEY, picks);
  renderDetail();
}

function startBattle(){
  if(!picks.a || !picks.b) return;
  sessionStorage.setItem('battleMode', 'manual');
  sessionStorage.setItem('playerTeam', JSON.stringify(picks.a.team));
  sessionStorage.setItem('enemyTeam', JSON.stringify(picks.b.team));
  window.location.href = '/battle';
}

function saveLineupToStorage(){
  const lineup = currentLineup();
  if(!lineup) return;
  const spirits = loadJson(STORAGE_KEY, []);
  const teams = loadJson(USER_TEAMS_KEY, []);
  const idMap = [];
  (lineup.members || []).forEach(member => {
    const id = `sp-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    idMap.push(id);
    spirits.push({
      id,
      name: member.name,
      nickname: member.nickname || member.name,
      icon_url: member.icon_url || '',
      element: member.element || '',
      element_icons: member.element_icons || [],
      ability: member.ability || '',
      ability_effect: member.ability_effect || '',
      nature: member.nature || '坦率',
      bloodline: member.bloodline || '',
      iv_names: member.iv_names || [],
      iv_config: member.iv_config || null,
      skills: member.skills || [],
      skill_details: member.skill_details || [],
      source_lineup: lineup.name,
      created_at: new Date().toISOString(),
    });
  });
  teams.push({
    id: `team-${Date.now()}-${Math.random().toString(16).slice(2)}`,
    name: lineup.name,
    description: lineup.description || '',
    magic: lineup.magic || '',
    magic_label: lineup.magic_label || magicLabel(lineup.magic),
    magic_icon_url: lineup.magic_icon_url || '',
    source_type: 'user',
    source_lineup_id: lineup.id,
    spirit_ids: idMap,
    members: (lineup.members || []).map(m => ({...m})),
    updated_at: new Date().toLocaleDateString('zh-CN'),
  });
  saveJson(STORAGE_KEY, spirits);
  saveJson(USER_TEAMS_KEY, teams);
  loadUserLineups();
  renderMagicFilter();
  renderList();
  renderDetail();
}

function deleteCurrentUserLineup(){
  const lineup = currentLineup();
  if(!lineup || lineup.source_type !== 'user') return;
  deleteUserLineup(lineup.id);
}

function deleteUserLineup(id){
  const teams = loadJson(USER_TEAMS_KEY, []).filter(item => item.id !== id);
  saveJson(USER_TEAMS_KEY, teams);
  if(picks.a && picks.a.id === id && picks.a.source_type === 'user') picks.a = null;
  if(picks.b && picks.b.id === id && picks.b.source_type === 'user') picks.b = null;
  saveJson(PICKS_KEY, picks);
  loadUserLineups();
  renderMagicFilter();
  const first = filteredLineups()[0];
  selectedKey = first ? lineupKey(first) : '';
  renderList();
  renderDetail();
}

init().catch(err => {
  document.getElementById('detail').innerHTML = `<div class="detail-empty">阵容库加载失败：${esc(err.message || err)}</div>`;
});
</script>
</body>
</html>
