<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛克王国 · 技能图鉴</title>
<link rel="stylesheet" href="theme.css">
<style>
body { min-height: 100vh; }
.skill-dex-layout {
  display: grid;
  grid-template-columns: 350px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}
.skill-sidebar {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--r-lg);
  padding: 12px;
  position: sticky;
  top: 14px;
  height: calc(100vh - 90px);
  min-height: 560px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.toolbar {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-bottom: 10px;
}
.filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.list-summary { font-size: 11px; color: var(--text-secondary); margin: 0 2px 8px; }
.skill-sidebar-list { overflow-y: auto; padding-right: 4px; display: block; }
.skill-row {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr);
  gap: 9px;
  align-items: center;
  width: 100%;
  min-height: 66px;
  margin-bottom: 6px;
  background: var(--bg-input);
  border: 2px solid transparent;
  border-radius: var(--r-md);
  padding: 8px;
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
}
.skill-row:hover { border-color: var(--primary); transform: translateY(-1px); }
.skill-row.active { border-color: var(--primary); background: rgba(255,255,255,.7); box-shadow: var(--shadow-sm); }
.skill-icon {
  width: 48px;
  height: 48px;
  object-fit: contain;
  border-radius: var(--r-sm);
  background: rgba(255,255,255,.72);
  border: 1px solid var(--border);
}
.skill-icon.big { width: 84px; height: 84px; }
.skill-icon.missing {
  display: grid;
  place-items: center;
  font-weight: 900;
  color: var(--text-secondary);
}
.skill-name { font-size: 14px; font-weight: 900; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skill-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 20px;
  padding: 2px 7px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 900;
  background: var(--bg-card);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.chip.strong { color: var(--text-primary); }
.meta-icon { width: 18px; height: 18px; object-fit: contain; display: inline-block; flex: 0 0 auto; }
.meta-icon.large { width: 24px; height: 24px; }
.detail {
  min-height: calc(100vh - 90px);
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.detail-empty { color: var(--text-secondary); line-height: 1.7; padding: 20px; }
.detail-hero {
  display: grid;
  grid-template-columns: 112px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
.detail-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.detail-title { font-size: 28px; line-height: 1.1; color: var(--text-primary); font-weight: 900; }
.learner-total {
  color: var(--primary-dark);
  background: rgba(245,166,35,.12);
  border: 1px solid rgba(245,166,35,.3);
  border-radius: var(--r-sm);
  padding: 4px 8px;
  font-size: 12px;
  font-weight: 900;
  white-space: nowrap;
}
.info-grid {
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.info-item {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 8px 10px;
}
.info-label { color: var(--text-secondary); font-size: 10px; font-weight: 800; margin-bottom: 4px; }
.info-value { color: var(--text-primary); font-size: 13px; font-weight: 900; display: flex; align-items: center; gap: 5px; min-height: 18px; }
.detail-section { margin-top: 18px; }
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.section-head h3 { font-size: 16px; color: var(--text-primary); }
.section-count { font-size: 11px; color: var(--text-secondary); font-weight: 800; }
.description-box {
  color: var(--text-primary);
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 10px;
  font-size: 13px;
  line-height: 1.7;
}
.learner-groups { display: grid; gap: 12px; }
.learner-group {
  border: 1px solid var(--border);
  background: rgba(255,255,255,.38);
  border-radius: var(--r-md);
  padding: 10px;
}
.learner-group-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 900;
  margin-bottom: 8px;
}
.learner-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
}
.learner-card {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 8px;
  text-decoration: none;
  color: inherit;
  transition: border-color .15s, transform .15s;
}
.learner-card:hover { border-color: var(--primary); transform: translateY(-1px); }
.learner-card img {
  width: 40px;
  height: 40px;
  object-fit: contain;
  border-radius: 5px;
  background: rgba(255,255,255,.7);
  border: 1px solid var(--border);
}
.learner-name { font-size: 13px; font-weight: 900; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.learner-meta { margin-top: 3px; color: var(--text-secondary); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.method-badge {
  color: var(--primary-dark);
  background: rgba(245,166,35,.12);
  border: 1px solid rgba(245,166,35,.26);
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 10px;
  font-weight: 900;
  white-space: nowrap;
}
.empty-state { color: var(--text-secondary); font-size: 12px; padding: 8px; }
.source-link { color: var(--primary-dark); text-decoration: none; font-size: 12px; font-weight: 900; }
.source-link:hover { text-decoration: underline; }
@media(max-width:980px) {
  .skill-dex-layout { grid-template-columns: 1fr; }
  .skill-sidebar { position: static; height: 430px; min-height: 0; }
  .detail { min-height: auto; }
}
@media(max-width:720px) {
  .filter-row, .detail-hero, .info-grid { grid-template-columns: 1fr; }
  .detail-title-row { flex-direction: column; }
}
</style>
</head>
<body>
<div class="page-shell">
  <header class="roco-topbar">
    <img class="logo" src="assets/img/logo.png" alt="洛克王国">
    <div class="title">技能图鉴</div>
    <nav class="app-nav">
      <a href="/dex">图鉴</a>
      <a href="/skills" class="active">技能</a>
      <a href="/mechanics">机制</a>
      <a href="/tools">工具</a>
      <a href="/storage">仓库</a>
      <a href="/simulator">队伍</a>
      <a href="/battle">对战</a>
    </nav>
  </header>

  <main class="page-main">
    <div class="skill-dex-layout">
      <aside class="skill-sidebar">
        <div class="toolbar">
          <input id="q" class="roco-input" placeholder="搜索技能名称、描述、属性或分类" autocomplete="off">
          <div class="filter-row">
            <select id="element" class="roco-select"><option value="">全部属性</option></select>
            <select id="category" class="roco-select"><option value="">全部分类</option></select>
          </div>
        </div>
        <div id="summary" class="list-summary">加载中...</div>
        <section id="skill-list" class="skill-sidebar-list"></section>
      </aside>

      <section id="detail" class="detail">
        <div class="detail-empty">选择一个技能查看完整效果和可学习精灵。</div>
      </section>
    </div>
  </main>
</div>

<script>
let allSkills = [];
let skills = [];
let selectedName = '';
let didInitialSelect = false;

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}
function iconImg(src, label, cls='meta-icon'){
  return src ? `<img class="${cls}" src="${esc(src)}" alt="${esc(label)}">` : '';
}
function skillIcon(skill, cls='skill-icon'){
  if(skill.icon_url) return `<img class="${cls}" src="${esc(skill.icon_url)}" alt="${esc(skill.name)}">`;
  return `<span class="${cls} missing">${esc((skill.name || '?').slice(0,1))}</span>`;
}
function metaChip(icon, label, value, strong=false){
  return `<span class="chip ${strong ? 'strong' : ''}">${iconImg(icon, label)}${esc(value)}</span>`;
}
function methodKind(group){
  const text = String(group || '');
  if(text.includes('血脉')) return 'bloodline';
  if(text.includes('技能石') || text.includes('可学')) return 'stone';
  return 'level';
}
function methodTitle(group){
  const kind = methodKind(group);
  if(kind === 'bloodline') return '血脉可学习精灵';
  if(kind === 'stone') return '技能石可学习精灵';
  return '升级可学习精灵';
}
function methodBadge(row){
  const kind = methodKind(row.learn_group);
  if(kind === 'bloodline') return '血脉';
  if(kind === 'stone') return '技能石';
  return row.learn_level || '升级';
}

async function loadSkills(){
  if(!allSkills.length){
    const res = await fetch('/api/skills/list');
    allSkills = await res.json();
  }
  const q = document.getElementById('q').value.trim();
  const element = document.getElementById('element').value;
  const category = document.getElementById('category').value;
  skills = allSkills.filter(skill => {
    const hay = [skill.name, skill.description, skill.element, skill.category, skill.effect_summary].filter(Boolean).join(' ');
    const okQ = !q || hay.includes(q);
    const okElement = !element || skill.element === element;
    const okCategory = !category || skill.category === category;
    return okQ && okElement && okCategory;
  });
  renderFilters();
  renderList();
  selectInitialSkill();
}

function renderFilters(){
  const currentElement = document.getElementById('element').value;
  const currentCategory = document.getElementById('category').value;
  const elements = [...new Set(allSkills.map(s => s.element).filter(Boolean))].sort();
  const categories = [...new Set(allSkills.map(s => s.category).filter(Boolean))].sort();
  document.getElementById('element').innerHTML = '<option value="">全部属性</option>' + elements.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('');
  document.getElementById('category').innerHTML = '<option value="">全部分类</option>' + categories.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if(elements.includes(currentElement)) document.getElementById('element').value = currentElement;
  if(categories.includes(currentCategory)) document.getElementById('category').value = currentCategory;
}

function selectInitialSkill(){
  const querySkill = new URLSearchParams(location.search).get('skill');
  const target = (!didInitialSelect && querySkill && skills.some(s => s.name === querySkill)) ? querySkill
    : (selectedName && skills.some(s => s.name === selectedName)) ? selectedName
    : skills[0]?.name;
  didInitialSelect = true;
  if(target) showDetail(target, false);
  else document.getElementById('detail').innerHTML = '<div class="detail-empty">没有匹配的技能。</div>';
}

function renderList(){
  const list = document.getElementById('skill-list');
  document.getElementById('summary').textContent = `${skills.length} / ${allSkills.length} 个技能`;
  if(!skills.length){
    list.innerHTML = '<div class="empty-state">没有匹配的技能</div>';
    return;
  }
  list.innerHTML = skills.map(skill => `
    <article class="skill-row ${skill.name === selectedName ? 'active' : ''}" data-name="${esc(skill.name)}">
      ${skillIcon(skill)}
      <div>
        <div class="skill-name">${esc(skill.name)}</div>
        <div class="skill-meta">
          ${metaChip(skill.attribute_icon_url, skill.element, skill.element, true)}
          ${metaChip(skill.category_icon_url, skill.category, skill.category, true)}
          ${metaChip(skill.energy_icon_url, '耗能', `耗${skill.energy_cost}`)}
          <span class="chip">${skill.power > 0 ? '威' + esc(skill.power) : '无威力'}</span>
          <span class="chip">${esc(skill.learners_count || 0)}只</span>
        </div>
      </div>
    </article>
  `).join('');
  list.querySelectorAll('.skill-row').forEach(card => {
    card.onclick = () => showDetail(card.dataset.name, true);
  });
  const active = list.querySelector('.skill-row.active');
  if(active) active.scrollIntoView({ block: 'nearest' });
}

async function showDetail(name, updateUrl=true){
  selectedName = name;
  renderList();
  if(updateUrl) history.replaceState(null, '', `/skills?skill=${encodeURIComponent(name)}`);
  const detail = document.getElementById('detail');
  detail.innerHTML = '<div class="detail-empty">加载中...</div>';
  const res = await fetch(`/api/skills/detail?name=${encodeURIComponent(name)}`);
  if(!res.ok){
    detail.innerHTML = '<div class="detail-empty">技能详情加载失败。</div>';
    return;
  }
  const skill = await res.json();
  const learners = skill.learners || [];

  detail.innerHTML = `
    <div class="detail-hero">
      ${skillIcon(skill, 'skill-icon big')}
      <div>
        <div class="detail-title-row">
          <div class="detail-title">${esc(skill.name)}</div>
          <span class="learner-total">${learners.length} 只可学</span>
        </div>
        <div class="skill-meta" style="margin-top:10px">
          ${metaChip(skill.attribute_icon_url, skill.element, skill.element, true)}
          ${metaChip(skill.category_icon_url, skill.category, skill.category, true)}
          ${metaChip(skill.energy_icon_url, '耗能', `耗能 ${skill.energy_cost}`, true)}
          <span class="chip strong">${skill.power > 0 ? '威力 ' + esc(skill.power) : '无威力'}</span>
          ${skill.source ? `<span class="chip">${esc(skill.source)}</span>` : ''}
        </div>
        <div class="info-grid">
          <div class="info-item"><div class="info-label">系别</div><div class="info-value">${iconImg(skill.attribute_icon_url, skill.element, 'meta-icon large')}${esc(skill.element || '未知')}</div></div>
          <div class="info-item"><div class="info-label">类型</div><div class="info-value">${iconImg(skill.category_icon_url, skill.category, 'meta-icon large')}${esc(skill.category || '未知')}</div></div>
          <div class="info-item"><div class="info-label">耗能</div><div class="info-value">${iconImg(skill.energy_icon_url, '耗能', 'meta-icon large')}${esc(skill.energy_cost ?? '-')}</div></div>
          <div class="info-item"><div class="info-label">威力</div><div class="info-value">${skill.power > 0 ? esc(skill.power) : '无'}</div></div>
        </div>
      </div>
    </div>

    <section class="detail-section">
      <div class="section-head"><h3>技能描述</h3></div>
      <div class="description-box">${esc(skill.description || skill.effect_summary || '暂无描述')}</div>
    </section>

    <section class="detail-section">
      <div class="section-head"><h3>可学习精灵</h3><span class="section-count">${learners.length} 只</span></div>
      <div class="learner-groups">${renderLearnerGroups(learners)}</div>
    </section>

    ${skill.wiki_url ? `<div class="detail-section"><a class="source-link" href="${esc(skill.wiki_url)}" target="_blank" rel="noreferrer">Wiki 原页</a></div>` : ''}
  `;
}

function renderLearnerGroups(learners){
  if(!learners.length) return '<div class="empty-state">暂无可学习精灵数据。</div>';
  const ordered = [
    ['level', '升级可学习精灵'],
    ['stone', '技能石可学习精灵'],
    ['bloodline', '血脉可学习精灵'],
  ];
  return ordered.map(([kind, title]) => {
    const rows = learners.filter(row => methodKind(row.learn_group) === kind);
    if(!rows.length) return '';
    return `
      <section class="learner-group">
        <div class="learner-group-title"><span>${esc(title)}</span><span>${rows.length}</span></div>
        <div class="learner-list">
          ${rows.map(row => `
            <a class="learner-card" href="/dex?pokemon=${encodeURIComponent(row.name)}" title="${esc(row.learn_group || '')}">
              ${row.icon_url ? `<img src="${esc(row.icon_url)}" alt="${esc(row.name)}">` : '<span></span>'}
              <div>
                <div class="learner-name">${esc(row.name)}</div>
                <div class="learner-meta">${esc(row.number || 'NO.???')} · ${esc(row.element || '未知')} · BST ${esc(row.base_total || 0)}</div>
              </div>
              <span class="method-badge">${esc(methodBadge(row))}</span>
            </a>
          `).join('')}
        </div>
      </section>
    `;
  }).join('') || '<div class="empty-state">暂无可学习精灵数据。</div>';
}

let timer = 0;
document.getElementById('q').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(loadSkills, 160);
});
document.getElementById('element').addEventListener('change', loadSkills);
document.getElementById('category').addEventListener('change', loadSkills);
loadSkills();
</script>
</body>
</html>
