<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛克王国 · 技能图鉴</title>
<link rel="stylesheet" href="theme.css">
<style>
body { min-height: 100vh; }
.toolbar {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) 150px 150px;
  gap: 10px;
  margin-bottom: 14px;
}
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 390px;
  gap: 14px;
  align-items: start;
}
.skill-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 10px;
  align-content: start;
}
.skill-card {
  min-height: 104px;
  background: var(--bg-input);
  border: 2px solid var(--border);
  border-radius: var(--r-md);
  padding: 10px;
  cursor: pointer;
  transition: transform .15s, border-color .15s, box-shadow .15s;
}
.skill-card:hover,
.skill-card.active {
  border-color: var(--primary);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.skill-top { display: flex; gap: 9px; align-items: flex-start; }
.skill-name { font-size: 14px; font-weight: 900; color: var(--text-primary); }
.skill-meta { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.chip {
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 7px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 800;
  background: var(--bg-card);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.type-chip { color: #fff; border: none; }
.desc {
  margin-top: 8px;
  color: var(--text-secondary);
  font-size: 11px;
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.detail {
  position: sticky;
  top: 14px;
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}
.detail-empty {
  color: var(--text-secondary);
  font-size: 13px;
  line-height: 1.7;
}
.detail-head {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 12px;
}
.detail .skill-icon { width: 54px; height: 54px; }
.detail-title { font-size: 20px; font-weight: 900; color: var(--text-primary); }
.detail-section { margin-top: 14px; }
.detail-section h3 {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: .6px;
}
.effect-list, .learner-list { display: flex; flex-wrap: wrap; gap: 5px; }
.learner {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 7px;
  border-radius: var(--r-sm);
  background: rgba(255,255,255,.55);
  border: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-primary);
}
.learner img { width: 24px; height: 24px; object-fit: contain; }
.source-link {
  color: var(--primary-dark);
  text-decoration: none;
  font-size: 12px;
  font-weight: 800;
}
.source-link:hover { text-decoration: underline; }
.t-普通{background:#A8A878}.t-火{background:#F08030}.t-水{background:#6890F0}
.t-草{background:#78C850}.t-电{background:#F8D030;color:#5a4000}.t-冰{background:#98D8D8;color:#2a5a5a}
.t-武{background:#C03028}.t-毒{background:#A040A0}.t-地{background:#E0C068;color:#5a4000}
.t-翼{background:#A890F0}.t-幻{background:#F85888}.t-虫{background:#A8B820}
.t-幽{background:#705898}.t-龙{background:#7038F8}.t-恶{background:#705848}
.t-机械{background:#B8B8D0;color:#444}.t-萌{background:#EE99AC}.t-光{background:#FFD966;color:#5a4000}
.empty-state {
  grid-column: 1 / -1;
  padding: 36px;
  text-align: center;
  color: var(--text-secondary);
  background: var(--bg-card);
  border-radius: var(--r-lg);
  border: 1px dashed var(--border-strong);
}
@media (max-width: 900px) {
  .toolbar, .layout { grid-template-columns: 1fr; }
  .detail { position: static; }
}
</style>
</head>
<body>
<div class="page-shell">
  <header class="roco-topbar">
    <img class="logo" src="assets/img/logo.png" alt="洛克王国">
    <div class="title">技能图鉴</div>
    <nav class="app-nav">
      <a href="/dex">图鉴</a>
      <a href="/skills" class="active">技能</a>
      <a href="/mechanics">机制</a>
      <a href="/storage">仓库</a>
      <a href="/simulator">队伍</a>
      <a href="/battle">对战</a>
    </nav>
  </header>

  <main class="page-main">
    <div class="toolbar">
      <input id="q" class="roco-input" placeholder="搜索技能名称、描述、属性或分类" autocomplete="off">
      <select id="element" class="roco-select">
        <option value="">全部属性</option>
      </select>
      <select id="category" class="roco-select">
        <option value="">全部分类</option>
      </select>
    </div>

    <div class="layout">
      <section id="skill-list" class="skill-list"></section>
      <aside id="detail" class="detail">
        <div class="detail-empty">选择一个技能查看完整效果、实现标签和可学习精灵。</div>
      </aside>
    </div>
  </main>
</div>

<script>
const TYPE_CLASS = {
  普通:'t-普通',火:'t-火',水:'t-水',草:'t-草',电:'t-电',冰:'t-冰',武:'t-武',
  毒:'t-毒',地:'t-地',翼:'t-翼',幻:'t-幻',虫:'t-虫',幽:'t-幽',龙:'t-龙',
  恶:'t-恶',机械:'t-机械',萌:'t-萌',光:'t-光',
};
let skills = [];
let selectedName = '';

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function iconHtml(skill, big=false){
  if(skill.icon_url){
    return `<img class="skill-icon" src="${esc(skill.icon_url)}" alt="${esc(skill.name)}">`;
  }
  return `<span class="skill-icon missing">${esc((skill.name || '?').slice(0,1))}</span>`;
}

async function loadSkills(){
  const params = new URLSearchParams();
  const q = document.getElementById('q').value.trim();
  const element = document.getElementById('element').value;
  const category = document.getElementById('category').value;
  if(q) params.set('q', q);
  if(element) params.set('element', element);
  if(category) params.set('category', category);
  const res = await fetch(`/api/skills/list?${params.toString()}`);
  skills = await res.json();
  renderFilters();
  renderList();
  const initialSkill = new URLSearchParams(location.search).get('skill');
  if(initialSkill && !selectedName && skills.some(s => s.name === initialSkill)) {
    showDetail(initialSkill);
  } else if(selectedName && skills.some(s => s.name === selectedName)) {
    showDetail(selectedName);
  } else if(skills[0]) {
    showDetail(skills[0].name);
  } else {
    document.getElementById('detail').innerHTML = '<div class="detail-empty">没有匹配的技能。</div>';
  }
}

function renderFilters(){
  const elements = [...new Set(skills.map(s => s.element).filter(Boolean))].sort();
  const categories = [...new Set(skills.map(s => s.category).filter(Boolean))].sort();
  fillSelect('element', '全部属性', elements);
  fillSelect('category', '全部分类', categories);
}

function fillSelect(id, label, values){
  const el = document.getElementById(id);
  const current = el.value;
  el.innerHTML = `<option value="">${label}</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  if(values.includes(current)) el.value = current;
}

function renderList(){
  const list = document.getElementById('skill-list');
  if(!skills.length){
    list.innerHTML = '<div class="empty-state">没有匹配的技能</div>';
    return;
  }
  list.innerHTML = skills.map(skill => {
    const tags = (skill.effect_tags || []).slice(0, 3).map(t => `<span class="chip">${esc(t)}</span>`).join('');
    return `
      <article class="skill-card ${skill.name === selectedName ? 'active' : ''}" data-name="${esc(skill.name)}">
        <div class="skill-top">
          ${iconHtml(skill)}
          <div>
            <div class="skill-name">${esc(skill.name)}</div>
            <div class="skill-meta">
              <span class="chip type-chip ${TYPE_CLASS[skill.element] || ''}">${esc(skill.element)}</span>
              <span class="chip">${esc(skill.category)}</span>
              <span class="chip">耗${esc(skill.energy_cost)}</span>
              <span class="chip">${skill.power > 0 ? '威' + esc(skill.power) : '无威力'}</span>
              <span class="chip">${esc(skill.learners_count || 0)}只可学</span>
              ${tags}
            </div>
          </div>
        </div>
        <div class="desc">${esc(skill.description || skill.effect_summary || '暂无描述')}</div>
      </article>`;
  }).join('');
  list.querySelectorAll('.skill-card').forEach(card => {
    card.onclick = () => showDetail(card.dataset.name);
  });
}

async function showDetail(name){
  selectedName = name;
  renderList();
  const detail = document.getElementById('detail');
  detail.innerHTML = '<div class="detail-empty">加载中...</div>';
  const res = await fetch(`/api/skills/detail?name=${encodeURIComponent(name)}`);
  if(!res.ok){
    detail.innerHTML = '<div class="detail-empty">技能详情加载失败。</div>';
    return;
  }
  const skill = await res.json();
  const effectTags = (skill.effect_tags || []).map(t => `<span class="chip">${esc(t)}</span>`).join('');
  const effectDetails = (skill.effect_details || []).map(t => `<span class="chip">${esc(t)}</span>`).join('');
  const groups = groupLearners(skill.learners || []);
  detail.innerHTML = `
    <div class="detail-head">
      ${iconHtml(skill, true)}
      <div>
        <div class="detail-title">${esc(skill.name)}</div>
        <div class="skill-meta">
          <span class="chip type-chip ${TYPE_CLASS[skill.element] || ''}">${esc(skill.element)}</span>
          <span class="chip">${esc(skill.category)}</span>
          <span class="chip">耗${esc(skill.energy_cost)}</span>
          <span class="chip">${skill.power > 0 ? '威' + esc(skill.power) : '无威力'}</span>
          ${skill.source ? `<span class="chip">${esc(skill.source)}</span>` : ''}
        </div>
      </div>
    </div>
    <div class="detail-section">
      <h3>技能描述</h3>
      <div class="desc" style="-webkit-line-clamp:unset">${esc(skill.description || '暂无描述')}</div>
    </div>
    <div class="detail-section">
      <h3>效果标签</h3>
      <div class="effect-list">${effectDetails || effectTags || '<span class="chip">暂无结构化效果</span>'}</div>
    </div>
    <div class="detail-section">
      <h3>可学习精灵</h3>
      ${groups || '<div class="detail-empty">暂无可学习精灵数据。</div>'}
    </div>
    ${skill.wiki_url ? `<div class="detail-section"><a class="source-link" href="${esc(skill.wiki_url)}" target="_blank" rel="noreferrer">查看 Wiki 原页</a></div>` : ''}
  `;
}

function groupLearners(learners){
  if(!learners.length) return '';
  const map = new Map();
  learners.forEach(p => {
    const key = p.learn_group || '可学习';
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(p);
  });
  return [...map.entries()].map(([group, rows]) => `
    <div class="detail-section">
      <h3>${esc(group)} · ${rows.length}</h3>
      <div class="learner-list">
        ${rows.map(p => `
          <span class="learner">
            ${p.icon_url ? `<img src="${esc(p.icon_url)}" alt="${esc(p.name)}">` : ''}
            ${esc(p.name)}
          </span>
        `).join('')}
      </div>
    </div>
  `).join('');
}

let timer = 0;
document.getElementById('q').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(loadSkills, 180);
});
document.getElementById('element').addEventListener('change', loadSkills);
document.getElementById('category').addEventListener('change', loadSkills);
loadSkills();
</script>
</body>
</html>
