<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛克王国 · 机制百科</title>
<link rel="stylesheet" href="theme.css">
<style>
body { min-height: 100vh; }
.mechanics-layout {
  display: grid;
  grid-template-columns: 350px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}
.mechanics-sidebar {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--r-lg);
  padding: 12px;
  position: sticky;
  top: 14px;
  height: calc(100vh - 90px);
  min-height: 560px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.mechanics-search { margin-bottom: 10px; }
.mechanic-list { overflow-y: auto; padding-right: 4px; }
.cat-head {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  gap: 6px;
  align-items: center;
  padding: 8px 6px 5px;
  margin-top: 6px;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.cat-head:hover { color: var(--text-primary); }
.cat-count {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0 6px;
  font-size: 10px;
}
.mech-row {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  margin-top: 6px;
  padding: 8px;
  background: var(--bg-input);
  border: 2px solid transparent;
  border-radius: var(--r-md);
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
}
.mech-row:hover { border-color: var(--primary); transform: translateY(-1px); }
.mech-row.active { border-color: var(--primary); background: rgba(255,255,255,.7); box-shadow: var(--shadow-sm); }
.mech-row-icon {
  width: 34px;
  height: 34px;
  object-fit: contain;
  border-radius: 6px;
  background: rgba(255,255,255,.74);
  border: 1px solid var(--border);
  padding: 3px;
}
.mech-row-icon.fallback {
  padding: 0;
  border-radius: 50%;
}
.mech-dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--text-secondary);
  border: 2px solid rgba(255,255,255,.7);
  box-shadow: 0 0 0 1px var(--border);
}
.mech-dot.positive { background: #5ab86a; }
.mech-dot.negative { background: #d05c5c; }
.mech-dot.system { background: #c89b3c; }
.mech-name { color: var(--text-primary); font-size: 14px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mech-meta { color: var(--text-secondary); font-size: 11px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail {
  min-height: calc(100vh - 90px);
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.detail-empty { color: var(--text-secondary); line-height: 1.7; padding: 20px; }
.mech-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.mech-title { font-size: 28px; line-height: 1.1; color: var(--text-primary); font-weight: 900; }
.mech-head-icon {
  width: 48px;
  height: 48px;
  object-fit: contain;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: rgba(255,255,255,.74);
  padding: 4px;
}
.cat-tag, .polarity-tag {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-input);
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 900;
}
.polarity-tag.positive { color: #32854b; border-color: rgba(50,133,75,.32); background: rgba(90,184,106,.12); }
.polarity-tag.negative { color: #a53d3d; border-color: rgba(165,61,61,.32); background: rgba(208,92,92,.12); }
.polarity-tag.system { color: #8d6418; border-color: rgba(141,100,24,.32); background: rgba(200,155,60,.14); }
.wiki-body { color: var(--text-primary); font-size: 14px; line-height: 1.75; }
.wiki-body h2 { font-size: 19px; margin: 18px 0 8px; color: var(--primary-dark); }
.wiki-body h3 { font-size: 16px; margin: 16px 0 8px; border-left: 3px solid var(--primary); padding-left: 8px; }
.wiki-body h4 { font-size: 14px; margin: 14px 0 7px; color: var(--text-primary); }
.wiki-body p { margin: 8px 0; }
.wiki-body ul { margin: 5px 0 9px; padding-left: 20px; }
.wiki-body li { margin: 4px 0; }
.wiki-link { color: var(--primary-dark); font-weight: 900; text-decoration: none; border-bottom: 1px dotted currentColor; }
.wiki-link:hover { color: var(--primary); }
.inline-emphasis { color: var(--primary-dark); font-weight: 900; }
.wiki-table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  overflow: hidden;
}
.wiki-table th, .wiki-table td { border: 1px solid var(--border); padding: 7px 9px; vertical-align: top; text-align: left; }
.wiki-table th { background: rgba(255,255,255,.42); color: var(--text-primary); }
.detail-section { margin-top: 18px; }
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.section-head h3 { font-size: 16px; color: var(--text-primary); }
.section-count { color: var(--text-secondary); font-size: 11px; font-weight: 900; }
.related-skills {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 8px;
}
.skill-card {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 8px;
  color: var(--text-primary);
  text-decoration: none;
}
.skill-card:hover { border-color: var(--primary); }
.skill-icon {
  width: 38px;
  height: 38px;
  object-fit: contain;
  background: rgba(255,255,255,.72);
  border: 1px solid var(--border);
  border-radius: 5px;
}
.skill-name { font-size: 13px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skill-meta { display: flex; gap: 5px; flex-wrap: wrap; color: var(--text-secondary); font-size: 10px; margin-top: 3px; }
.meta-icon { width: 15px; height: 15px; object-fit: contain; display: inline-block; vertical-align: middle; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  min-height: 19px;
  padding: 1px 6px;
  border-radius: 5px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  font-size: 10px;
  font-weight: 900;
}
.ability-list { display: grid; gap: 10px; }
.ability-card {
  background: rgba(255,255,255,.38);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 10px;
}
.ability-title { color: var(--primary-dark); font-size: 14px; font-weight: 900; margin-bottom: 4px; }
.ability-effect { color: var(--text-primary); font-size: 12px; line-height: 1.65; margin-bottom: 8px; }
.pokemon-links {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 7px;
}
.pokemon-link {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 7px;
  color: var(--text-primary);
  text-decoration: none;
}
.pokemon-link:hover { border-color: var(--primary); }
.pokemon-link img {
  width: 38px;
  height: 38px;
  object-fit: contain;
  background: rgba(255,255,255,.72);
  border: 1px solid var(--border);
  border-radius: 5px;
}
.pokemon-name { font-size: 12px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pokemon-meta { color: var(--text-secondary); font-size: 10px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty-text { color: var(--text-secondary); font-size: 12px; padding: 8px; }
@media(max-width:980px) {
  .mechanics-layout { grid-template-columns: 1fr; }
  .mechanics-sidebar { position: static; height: 430px; min-height: 0; }
  .detail { min-height: auto; }
}
</style>
</head>
<body>
<div class="page-shell">
  <header class="roco-topbar">
    <img class="logo" src="assets/img/logo.png" alt="洛克王国">
    <div class="title">机制百科</div>
    <nav class="app-nav">
      <a href="/dex">图鉴</a>
      <a href="/skills">技能</a>
      <a href="/mechanics" class="active">机制</a>
      <a href="/storage">仓库</a>
      <a href="/simulator">队伍</a>
      <a href="/battle">对战</a>
    </nav>
  </header>
  <main class="page-main">
    <div class="mechanics-layout">
      <aside class="mechanics-sidebar">
        <div class="mechanics-search">
          <input id="q" class="roco-input" placeholder="搜索机制名、类目或说明" autocomplete="off">
        </div>
        <section id="mechanic-list" class="mechanic-list"></section>
      </aside>
      <section id="detail" class="detail">
        <div class="detail-empty">选择一个机制查看说明、相关技能和相关特性精灵。</div>
      </section>
    </div>
  </main>
</div>
<script>
let entries = [];
let skillNames = new Set();
let mechanicTitles = new Set();
let activeId = '';
const CATEGORY_ORDER = ['印记', '状态', '关键词'];
const POLARITY_LABEL = { positive: '正面', negative: '负面', system: '系统' };
const COLLAPSE_KEY = 'nrc.mechanics.collapsed';
const collapsed = new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '[]'));

function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function saveCollapsed(){ localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsed])); }
function toggleCat(cat){ collapsed.has(cat) ? collapsed.delete(cat) : collapsed.add(cat); saveCollapsed(); renderList(); }
function normalizeQuery(){ return (new URLSearchParams(location.search).get('q') || new URLSearchParams(location.search).get('mechanic') || '').trim(); }
function metaIcon(src, label){ return src ? `<img class="meta-icon" src="${esc(src)}" alt="${esc(label)}">` : ''; }

async function loadMechanics(){
  const res = await fetch('/api/mechanics/list');
  const data = await res.json();
  entries = data.entries || [];
  skillNames = new Set(data.skill_names || []);
  mechanicTitles = new Set(data.mechanic_titles || []);
  const initial = normalizeQuery();
  if(initial) document.getElementById('q').value = initial;
  renderList();
  const exact = entries.find(e => e.title === initial || e.id === initial);
  showDetail(exact || entries[0], false);
}

function filteredEntries(){
  const q = document.getElementById('q').value.trim();
  return entries.filter(e => {
    if(!q) return true;
    const hay = [e.title, e.category, POLARITY_LABEL[e.polarity], e.meta, e.body].filter(Boolean).join(' ');
    return hay.includes(q);
  });
}

function renderList(){
  const list = document.getElementById('mechanic-list');
  const rows = filteredEntries();
  if(!rows.length){
    list.innerHTML = '<div class="empty-text">没有匹配的机制</div>';
    return;
  }
  const searching = document.getElementById('q').value.trim().length > 0;
  list.innerHTML = CATEGORY_ORDER.map(cat => {
    const group = rows.filter(e => e.category === cat);
    if(!group.length) return '';
    const isCollapsed = !searching && collapsed.has(cat);
    return `
      <div class="cat-head ${isCollapsed ? 'collapsed' : ''}" data-cat="${esc(cat)}">
        <span>${isCollapsed ? '▶' : '▼'}</span>
        <span>${esc(cat)}</span>
        <span class="cat-count">${group.length}</span>
      </div>
      ${isCollapsed ? '' : group.map(rowHtml).join('')}
    `;
  }).join('');
  list.querySelectorAll('.cat-head').forEach(head => head.onclick = () => toggleCat(head.dataset.cat));
  list.querySelectorAll('.mech-row').forEach(row => row.onclick = () => {
    const entry = entries.find(e => e.id === row.dataset.id);
    if(entry) showDetail(entry, true);
  });
  const active = list.querySelector('.mech-row.active');
  if(active) active.scrollIntoView({ block: 'nearest' });
}

function rowHtml(entry){
  return `
    <article class="mech-row ${entry.id === activeId ? 'active' : ''}" data-id="${esc(entry.id)}">
      ${entry.icon_url ? `<img class="mech-row-icon" src="${esc(entry.icon_url)}" alt="${esc(entry.title)}">` : `<span class="mech-row-icon fallback mech-dot ${esc(entry.polarity)}"></span>`}
      <div>
        <div class="mech-name">${esc(entry.title)}</div>
        <div class="mech-meta">${esc(entry.meta || entry.category)} · 技能 ${entry.related_skills.length} · 特性 ${entry.related_abilities.length}</div>
      </div>
    </article>
  `;
}

function showDetail(entry, updateUrl=true){
  if(!entry) return;
  activeId = entry.id;
  if(updateUrl) history.replaceState(null, '', `/mechanics?q=${encodeURIComponent(entry.title)}`);
  renderList();
  document.getElementById('detail').innerHTML = `
    <div class="mech-head">
      ${entry.icon_url ? `<img class="mech-head-icon" src="${esc(entry.icon_url)}" alt="${esc(entry.title)}">` : ''}
      <span class="cat-tag">${esc(entry.category)}</span>
      <span class="mech-dot ${esc(entry.polarity)}"></span>
      <div class="mech-title">${esc(entry.title)}</div>
      <span class="polarity-tag ${esc(entry.polarity)}">${esc(POLARITY_LABEL[entry.polarity] || '系统')}</span>
    </div>
    <div class="wiki-body">${renderWiki(entry.body || '')}</div>
    ${relatedSkills(entry.related_skills || [])}
    ${relatedAbilities(entry.related_abilities || [])}
  `;
}

function renderWiki(text){
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  let html = '';
  let listDepth = 0;
  let inTable = false;
  let tableRows = [];
  function closeLists(to=0){ while(listDepth > to){ html += '</ul>'; listDepth--; } }
  function flushTable(){
    if(!inTable) return;
    html += '<table class="wiki-table">';
    tableRows.forEach(row => {
      html += '<tr>' + row.cells.map(c => `<${row.header?'th':'td'}>${inline(c)}</${row.header?'th':'td'}>`).join('') + '</tr>';
    });
    html += '</table>';
    tableRows = [];
    inTable = false;
  }
  lines.forEach(raw => {
    const line = raw.trim();
    if(line.startsWith('{|')){ closeLists(); inTable = true; tableRows = []; return; }
    if(inTable){
      if(line === '|}'){ flushTable(); return; }
      if(!line || line.startsWith('|-')) return;
      if(line.startsWith('!')) tableRows.push({ header:true, cells: line.slice(1).split(/\s*!!\s*/)});
      else if(line.startsWith('|')) tableRows.push({ header:false, cells: line.slice(1).split(/\s*\|\|\s*/)});
      return;
    }
    if(!line){ closeLists(); return; }
    let m = line.match(/^====\s*(.+?)\s*====$/);
    if(m){ closeLists(); html += `<h4>${esc(m[1])}</h4>`; return; }
    m = line.match(/^==\s*(.+?)\s*==$/);
    if(m){ closeLists(); html += `<h2>${esc(m[1])}</h2>`; return; }
    m = line.match(/^===\s*(.+?)\s*===$/);
    if(m){ closeLists(); html += `<h3>${esc(m[1])}</h3>`; return; }
    if(line.startsWith('*')){
      const marker = line.match(/^[*#]+/)[0];
      const depth = marker.length;
      while(listDepth < depth){ html += '<ul>'; listDepth++; }
      closeLists(depth);
      html += `<li>${inline(line.slice(depth).trim())}</li>`;
      return;
    }
    if(line === '<references />' || line.startsWith('<!--')) return;
    closeLists();
    html += `<p>${inline(line)}</p>`;
  });
  closeLists();
  flushTable();
  return html;
}

function inline(text){
  let out = '';
  const re = /(\[\[[^\]]+\]\]|'''[^']+'''|<span[^>]*>[\s\S]*?<\/span>)/g;
  let i = 0, m;
  while((m = re.exec(text))){
    out += esc(text.slice(i, m.index));
    const token = m[0];
    if(token.startsWith('[[')){
      const inner = token.slice(2, -2);
      const parts = inner.split('|');
      const page = parts[0].trim();
      const display = (parts[1] || parts[0]).trim();
      out += linkFor(page, display);
    } else if(token.startsWith("'''")){
      out += `<strong>${esc(token.slice(3, -3))}</strong>`;
    } else {
      out += `<span class="inline-emphasis">${esc(token.replace(/<[^>]+>/g, ''))}</span>`;
    }
    i = m.index + token.length;
  }
  out += esc(text.slice(i));
  return out;
}

function linkFor(page, display){
  if(mechanicTitles.has(page)) return `<a class="wiki-link" href="/mechanics?q=${encodeURIComponent(page)}">${esc(display)}</a>`;
  if(skillNames.has(page)) return `<a class="wiki-link" href="/skills?skill=${encodeURIComponent(page)}">${esc(display)}</a>`;
  return `<span class="inline-emphasis">${esc(display)}</span>`;
}

function relatedSkills(rows){
  if(!rows.length) return '';
  return `
    <section class="detail-section">
      <div class="section-head"><h3>涉及该机制的技能</h3><span class="section-count">${rows.length} 个</span></div>
      <div class="related-skills">
        ${rows.map(skill => `
          <a class="skill-card" href="/skills?skill=${encodeURIComponent(skill.name)}">
            ${skill.icon_url ? `<img class="skill-icon" src="${esc(skill.icon_url)}" alt="${esc(skill.name)}">` : '<span></span>'}
            <div>
              <div class="skill-name">${esc(skill.name)}</div>
              <div class="skill-meta">
                <span class="chip">${metaIcon(skill.attribute_icon_url, skill.element)}${esc(skill.element)}</span>
                <span class="chip">${metaIcon(skill.category_icon_url, skill.category)}${esc(skill.category)}</span>
                <span class="chip">${metaIcon(skill.energy_icon_url, '耗能')}耗${esc(skill.energy_cost)}</span>
              </div>
            </div>
            <span class="chip">${skill.power > 0 ? '威' + esc(skill.power) : '无威力'}</span>
          </a>
        `).join('')}
      </div>
    </section>
  `;
}

function relatedAbilities(rows){
  if(!rows.length) return '';
  return `
    <section class="detail-section">
      <div class="section-head"><h3>涉及该机制的特性精灵</h3><span class="section-count">${rows.length} 个特性</span></div>
      <div class="ability-list">
        ${rows.map(ability => `
          <article class="ability-card">
            <div class="ability-title">${esc(ability.name)}</div>
            <div class="ability-effect">${esc(ability.effect || '暂无效果描述')}</div>
            <div class="pokemon-links">
              ${(ability.pokemon || []).map(p => `
                <a class="pokemon-link" href="/dex?pokemon=${encodeURIComponent(p.name)}">
                  ${p.icon_url ? `<img src="${esc(p.icon_url)}" alt="${esc(p.name)}">` : '<span></span>'}
                  <div>
                    <div class="pokemon-name">${esc(p.name)}</div>
                    <div class="pokemon-meta">${esc(p.number || 'NO.???')} · ${esc(p.element || '未知')} · BST ${esc(p.base_total || 0)}</div>
                  </div>
                </a>
              `).join('')}
            </div>
          </article>
        `).join('')}
      </div>
    </section>
  `;
}

let timer = 0;
document.getElementById('q').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => { renderList(); }, 120);
});
loadMechanics();
</script>
</body>
</html>
