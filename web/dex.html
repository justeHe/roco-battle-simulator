<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛克王国 · 图鉴</title>
<link rel="stylesheet" href="theme.css">
<style>
body { min-height: 100vh; }
.dex-layout {
  display: grid;
  grid-template-columns: 350px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}
.dex-sidebar {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--r-lg);
  padding: 12px;
  position: sticky;
  top: 14px;
  height: calc(100vh - 90px);
  min-height: 560px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.toolbar { display: grid; grid-template-columns: 1fr 118px; gap: 8px; margin-bottom: 10px; }
.list-summary { font-size: 11px; color: var(--text-secondary); margin: 0 2px 8px; }
.poke-list { overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 6px; }
.poke-card {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr);
  gap: 9px;
  align-items: center;
  background: var(--bg-input);
  border: 2px solid transparent;
  border-radius: var(--r-md);
  padding: 8px;
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
}
.poke-card:hover { border-color: var(--primary); transform: translateY(-1px); }
.poke-card.active { border-color: var(--primary); background: rgba(255,255,255,.7); box-shadow: var(--shadow-sm); }
.poke-icon {
  width: 52px;
  height: 52px;
  object-fit: contain;
  border-radius: var(--r-sm);
  background: rgba(255,255,255,.68);
  border: 1px solid var(--border);
}
.poke-name { font-size: 14px; font-weight: 900; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.poke-meta { color: var(--text-secondary); font-size: 11px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.type-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 18px;
  padding: 0 7px;
  border-radius: 5px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  font-size: 10px;
  font-weight: 800;
  color: var(--text-secondary);
}
.type-icon { width: 15px; height: 15px; object-fit: contain; display: inline-block; }
.detail {
  min-height: calc(100vh - 90px);
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.detail-empty { color: var(--text-secondary); line-height: 1.7; padding: 20px; }
.detail-hero {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}
.portrait-box {
  background: var(--bg-input);
  border: 2px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px;
}
.detail-img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  display: block;
}
.variant-strip {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
  gap: 6px;
  margin-top: 10px;
}
.variant-btn {
  border: 1px solid var(--border);
  background: rgba(255,255,255,.55);
  border-radius: var(--r-sm);
  padding: 3px;
  cursor: pointer;
  height: 54px;
}
.variant-btn:hover { border-color: var(--primary); }
.variant-btn.active { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(245,166,35,.16); }
.variant-btn img { width: 100%; height: 100%; object-fit: contain; display: block; }
.detail-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.detail h2 { font-size: 28px; line-height: 1.1; color: var(--text-primary); }
.dex-no { font-size: 13px; font-weight: 900; color: var(--primary-dark); background: rgba(245,166,35,.12); border: 1px solid rgba(245,166,35,.3); border-radius: var(--r-sm); padding: 4px 8px; }
.detail-sub { margin-top: 7px; color: var(--text-secondary); font-size: 12px; }
.info-grid {
  margin-top: 14px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.info-item {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 8px 10px;
}
.info-label { color: var(--text-secondary); font-size: 10px; font-weight: 800; margin-bottom: 4px; }
.info-value { color: var(--text-primary); font-size: 13px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ability-box {
  margin-top: 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 10px;
}
.ability-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.ability-label { color: var(--text-secondary); font-size: 10px; font-weight: 800; }
.ability-name { color: var(--primary-dark); font-size: 13px; font-weight: 900; }
.ability-desc { color: var(--text-primary); font-size: 12px; line-height: 1.65; }
.detail-section { margin-top: 18px; }
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.section-head h3 { font-size: 16px; color: var(--text-primary); }
.section-count { font-size: 11px; color: var(--text-secondary); font-weight: 800; }
.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.stat-row { display: grid; grid-template-columns: 48px 40px 1fr; gap: 8px; align-items: center; font-size: 12px; color: var(--text-secondary); }
.stat-row b { color: var(--text-primary); text-align: right; }
.stat-track { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
.stat-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), var(--primary-dark)); }
.skill-tabs { display: grid; gap: 12px; }
.skill-group {
  border: 1px solid var(--border);
  background: rgba(255,255,255,.38);
  border-radius: var(--r-md);
  padding: 10px;
}
.skill-group-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--text-primary);
  font-weight: 900;
  font-size: 13px;
  margin-bottom: 8px;
}
.skill-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.skill-card {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--text-primary);
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 8px;
}
.skill-card:hover { border-color: var(--primary); }
.skill-icon {
  width: 36px;
  height: 36px;
  object-fit: contain;
  border-radius: 5px;
  background: rgba(255,255,255,.7);
  border: 1px solid var(--border);
}
.skill-name { font-size: 13px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skill-meta { margin-top: 3px; display: flex; gap: 4px; flex-wrap: wrap; color: var(--text-secondary); font-size: 10px; }
.skill-meta img { width: 14px; height: 14px; object-fit: contain; display: inline-block; vertical-align: middle; }
.level-badge {
  color: var(--primary-dark);
  background: rgba(245,166,35,.12);
  border: 1px solid rgba(245,166,35,.26);
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 10px;
  font-weight: 900;
  white-space: nowrap;
}
.empty-text { color: var(--text-secondary); font-size: 12px; padding: 8px; }
@media(max-width:980px) {
  .dex-layout { grid-template-columns: 1fr; }
  .dex-sidebar { position: static; height: 430px; min-height: 0; }
  .detail { min-height: auto; }
}
@media(max-width:720px) {
  .toolbar, .detail-hero, .info-grid, .stat-grid { grid-template-columns: 1fr; }
  .detail-title-row { align-items: flex-start; flex-direction: column; }
  .portrait-box { max-width: 260px; }
}
</style>
</head>
<body>
<div class="page-shell">
  <header class="roco-topbar">
    <img class="logo" src="assets/img/logo.png" alt="洛克王国">
    <div class="title">精灵图鉴</div>
    <nav class="app-nav">
      <a href="/dex" class="active">图鉴</a>
      <a href="/skills">技能</a>
      <a href="/mechanics">机制</a>
      <a href="/storage">仓库</a>
      <a href="/simulator">队伍</a>
      <a href="/battle">对战</a>
    </nav>
  </header>
  <main class="page-main">
    <div class="dex-layout">
      <aside class="dex-sidebar">
        <div class="toolbar">
          <input id="q" class="roco-input" placeholder="搜索名称、编号、属性或特性" autocomplete="off">
          <select id="element" class="roco-select"><option value="">全部属性</option></select>
        </div>
        <div id="summary" class="list-summary">加载中...</div>
        <section id="poke-grid" class="poke-list"></section>
      </aside>
      <section id="detail" class="detail">
        <div class="detail-empty">选择一只精灵查看编号、形态、种族值和技能资料。</div>
      </section>
    </div>
  </main>
</div>
<script>
let allPokemon = [];
let selected = '';
let selectedVariantName = '';
let didInitialSelect = false;

function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function numValue(no){
  const m = String(no || '').match(/\d+/);
  return m ? Number(m[0]) : 9999;
}
function cleanType(v){ return String(v || '').replace(/[，]/g, ',').split(',').map(x => x.trim()).filter(Boolean); }
function typePills(value, icons=[]){
  const types = cleanType(value);
  const iconMap = new Map((icons || []).map(item => [item.name, item.icon_url]));
  return (types.length ? types : ['未知']).map(t => {
    const icon = iconMap.get(t);
    return `<span class="type-pill">${icon ? `<img class="type-icon" src="${esc(icon)}" alt="${esc(t)}">` : ''}${esc(t)}</span>`;
  }).join('');
}
function baseName(name){ return String(name || '').replace(/（异色）$/, ''); }
function iconHtml(src, name, cls='poke-icon'){
  return src ? `<img class="${cls}" src="${esc(src)}" alt="${esc(name)}">` : `<div class="${cls}"></div>`;
}
function metaIcon(src, label){ return src ? `<img src="${esc(src)}" alt="${esc(label)}">` : ''; }
function abilityParts(p){
  if(p.ability_effect) return { name: p.ability || '暂无', effect: p.ability_effect };
  const full = String(p.ability_full || '').trim();
  if(full){
    const parts = full.split(/[:：](.*)/s).filter(Boolean);
    return { name: (parts[0] || p.ability || '暂无').trim(), effect: (parts[1] || '暂无效果描述').trim() };
  }
  return { name: p.ability || '暂无', effect: '暂无效果描述' };
}

function isLeaderPokemon(p){
  if(p.is_leader) return true;
  const text = [p.evo_stage, p.form_type, p.form].filter(Boolean).join(' ');
  return text.includes('首领');
}

async function loadPokemon(){
  const res = await fetch('/api/pokemon/list?q=');
  allPokemon = await res.json();
  allPokemon.sort((a,b) => numValue(a.number) - numValue(b.number) || a.name.localeCompare(b.name, 'zh-Hans-CN'));
  const elements = [...new Set(allPokemon.flatMap(p => cleanType(p.element)))].sort();
  document.getElementById('element').innerHTML = '<option value="">全部属性</option>' + elements.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('');
  renderList();
  const queryName = new URLSearchParams(location.search).get('pokemon') || new URLSearchParams(location.search).get('name');
  const target = queryName && allPokemon.some(p => p.name === queryName) ? queryName : allPokemon[0]?.name;
  didInitialSelect = true;
  if(target) showDetail(target, false);
}

function filtered(){
  const q = document.getElementById('q').value.trim();
  const element = document.getElementById('element').value;
  return allPokemon.filter(p => {
    const hay = [p.name, p.number, p.element, p.ability, p.evo_stage, p.form].filter(Boolean).join(' ');
    const okQ = !q || hay.includes(q);
    const okE = !element || cleanType(p.element).includes(element);
    return okQ && okE;
  });
}

function renderList(){
  const rows = filtered();
  document.getElementById('summary').textContent = `${rows.length} / ${allPokemon.length} 只精灵`;
  document.getElementById('poke-grid').innerHTML = rows.map(p => `
    <article class="poke-card ${p.name===selected?'active':''}" data-name="${esc(p.name)}">
      ${iconHtml(p.icon_url, p.name)}
      <div>
        <div class="poke-name">${esc(p.name)}</div>
        <div class="poke-meta">${esc(p.number || 'NO.???')} · ${esc(p.evo_stage || '形态未知')} · BST ${esc(p.base_total || 0)}</div>
        <div class="poke-meta">${typePills(p.element, p.element_icons)}</div>
      </div>
    </article>
  `).join('') || '<div class="empty-text">没有匹配的精灵</div>';
  document.querySelectorAll('.poke-card').forEach(card => {
    card.onclick = () => showDetail(card.dataset.name);
  });
  const active = document.querySelector('.poke-card.active');
  if(active && didInitialSelect) active.scrollIntoView({ block: 'nearest' });
}

function statRows(p){
  const stats = [
    ['生命', p.base_hp],
    ['物攻', p.base_atk],
    ['物防', p.base_def],
    ['魔攻', p.base_spatk],
    ['魔防', p.base_spdef],
    ['速度', p.base_speed],
  ];
  const max = Math.max(120, ...stats.map(([,v]) => Number(v) || 0));
  return stats.map(([name,val]) => {
    const value = Number(val) || 0;
    const width = Math.min(100, Math.round(value / max * 100));
    return `
      <div class="stat-row">
        <span>${name}</span>
        <b>${value}</b>
        <div class="stat-track"><div class="stat-fill" style="width:${width}%"></div></div>
      </div>`;
  }).join('');
}

function classifySkill(skill){
  const group = `${skill.learn_group || ''} ${skill.skill_group || ''}`;
  if(group.includes('血脉')) return 'bloodline';
  if(group.includes('技能石') || group.includes('可学')) return 'stone';
  return 'level';
}

function groupSkills(skills){
  const grouped = { level: [], stone: [], bloodline: [] };
  skills.forEach(skill => grouped[classifySkill(skill)].push(skill));
  return grouped;
}

function skillCard(skill){
  const level = skill.learn_level || '';
  const levelLabel = level || (classifySkill(skill) === 'level' ? '等级 —' : (skill.learn_group || '来源 —'));
  return `
    <a class="skill-card" href="/skills?skill=${encodeURIComponent(skill.name)}">
      ${iconHtml(skill.icon_url, skill.name, 'skill-icon')}
      <div>
        <div class="skill-name">${esc(skill.name)}</div>
        <div class="skill-meta">
          <span>${metaIcon(skill.attribute_icon_url, skill.element)}${esc(skill.element || '未知')}</span>
          <span>${metaIcon(skill.category_icon_url, skill.category)}${esc(skill.category || '')}</span>
          <span>${metaIcon(skill.energy_icon_url, '耗能')}耗${esc(skill.energy_cost ?? '-')}</span>
          ${skill.power ? `<span>威${esc(skill.power)}</span>` : ''}
        </div>
      </div>
      <span class="level-badge">${esc(levelLabel)}</span>
    </a>`;
}

function skillGroup(title, rows){
  return `
    <section class="skill-group">
      <div class="skill-group-title"><span>${title}</span><span>${rows.length}</span></div>
      <div class="skill-list">${rows.map(skillCard).join('') || '<div class="empty-text">暂无数据</div>'}</div>
    </section>`;
}

function renderVariants(detail){
  const variants = (detail.variants || []).filter(v => v.icon_url);
  if(variants.length <= 1) return '';
  return `
    <div class="variant-strip">
      ${variants.map(v => `
        <button class="variant-btn ${v.name === selectedVariantName ? 'active' : ''}" title="${esc(v.name)}" data-variant-name="${esc(v.name)}" data-variant-icon="${esc(v.icon_url)}">
          <img src="${esc(v.icon_url)}" alt="${esc(v.name)}">
        </button>
      `).join('')}
    </div>`;
}

function bindVariantButtons(){
  document.querySelectorAll('.variant-btn').forEach(btn => {
    btn.onclick = () => {
      const name = btn.dataset.variantName;
      const existing = allPokemon.find(p => p.name === name);
      if(existing){
        showDetail(name);
        return;
      }
      selectedVariantName = name;
      document.getElementById('detail-img').src = btn.dataset.variantIcon;
      document.getElementById('variant-name').textContent = name;
      document.querySelectorAll('.variant-btn').forEach(x => x.classList.toggle('active', x === btn));
    };
  });
}

async function showDetail(name, updateUrl=true){
  selected = name;
  selectedVariantName = name;
  renderList();
  if(updateUrl) history.replaceState(null, '', `/dex?pokemon=${encodeURIComponent(name)}`);
  const detailEl = document.getElementById('detail');
  detailEl.innerHTML = '<div class="detail-empty">加载中...</div>';

  const [detailRes, skillsRes] = await Promise.all([
    fetch(`/api/pokemon/detail?name=${encodeURIComponent(name)}`),
    fetch(`/api/pokemon/skills?name=${encodeURIComponent(name)}`),
  ]);
  if(!detailRes.ok){
    detailEl.innerHTML = '<div class="detail-empty">没有找到这只精灵的数据。</div>';
    return;
  }
  const p = await detailRes.json();
  const skills = await skillsRes.json();
  const leader = isLeaderPokemon(p);
  const visibleSkills = leader ? skills.filter(skill => classifySkill(skill) !== 'bloodline') : skills;
  const grouped = groupSkills(visibleSkills);
  const portrait = p.icon_url || (p.variants && p.variants[0] && p.variants[0].icon_url) || '';
  const ability = abilityParts(p);

  detailEl.innerHTML = `
    <div class="detail-hero">
      <div class="portrait-box">
        ${portrait ? `<img id="detail-img" class="detail-img" src="${esc(portrait)}" alt="${esc(p.name)}">` : '<div id="detail-img" class="detail-img"></div>'}
        ${renderVariants(p)}
      </div>
      <div>
        <div class="detail-title-row">
          <h2>${esc(p.name)}</h2>
          <span class="dex-no">${esc(p.number || 'NO.???')}</span>
        </div>
        <div id="variant-name" class="detail-sub">${esc(selectedVariantName)}</div>
        <div class="detail-tags" style="margin-top:10px">${typePills(p.element, p.element_icons)}</div>
        <div class="info-grid">
          <div class="info-item"><div class="info-label">阶段</div><div class="info-value">${esc(p.evo_stage || '未知')}</div></div>
          <div class="info-item"><div class="info-label">形态</div><div class="info-value">${esc(p.form || p.form_type || '默认')}</div></div>
          <div class="info-item"><div class="info-label">特性</div><div class="info-value">${esc(ability.name)}</div></div>
          <div class="info-item"><div class="info-label">种族值合计</div><div class="info-value">${esc(p.base_total || 0)}</div></div>
        </div>
        <div class="ability-box">
          <div class="ability-head"><span class="ability-label">特性效果</span><span class="ability-name">${esc(ability.name)}</span></div>
          <div class="ability-desc">${esc(ability.effect)}</div>
        </div>
      </div>
    </div>

    <section class="detail-section">
      <div class="section-head"><h3>种族值</h3><span class="section-count">BST ${esc(p.base_total || 0)}</span></div>
      <div class="stat-grid">${statRows(p)}</div>
    </section>

    <section class="detail-section">
      <div class="section-head"><h3>技能</h3><span class="section-count">${visibleSkills.length} 个</span></div>
      <div class="skill-tabs">
        ${skillGroup('本身可学技能', grouped.level)}
        ${skillGroup('技能石技能', grouped.stone)}
        ${leader ? '' : skillGroup('血脉招式', grouped.bloodline)}
      </div>
    </section>
  `;
  bindVariantButtons();
}

document.getElementById('q').addEventListener('input', renderList);
document.getElementById('element').addEventListener('change', renderList);
loadPokemon();
</script>
</body>
</html>
